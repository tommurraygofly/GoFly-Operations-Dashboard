    } catch (err) { fail++; }
  }
  box.dataset.busy = '';
  msg.textContent = fail ? `${plural(fail, 'photo')} couldn’t upload. Check your connection and try again.` : `${plural(ok, 'photo')} added. Save to keep ${ok > 1 ? 'them' : 'it'}.`;
});
/* Defect photos: resized on the device (max 1600 px JPEG), stored through /api/files and shown
   only to signed-in people. */
const phThumb = id => `<span class="ph"><img data-photo="${esc(id)}" alt="Defect photo"><button type="button" class="ph-x" data-phdel="${esc(id)}" aria-label="Remove photo">×</button></span>`;
async function shrinkImage(file, max, q) {
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement('canvas');
    c.width = Math.max(1, Math.round(img.naturalWidth * k)); c.height = Math.max(1, Math.round(img.naturalHeight * k));
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    return c.toDataURL('image/jpeg', q);
  } finally { URL.revokeObjectURL(url); }
}
async function uploadPhoto(file) {
  if (!Who || !Who.token) throw new Error('Not signed in');
  let data = await shrinkImage(file, 1600, 0.78);
  if (data.length > 1400000) data = await shrinkImage(file, 1200, 0.7);
  const r = await fetch('/api/files', { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + Who.token }, body: JSON.stringify({ type: 'image/jpeg', data: data.split(',')[1] }) });
  if (!r.ok) throw new Error('Upload failed ' + r.status);
  return (await r.json()).id;
}
const photoCache = new Map();
function photoURL(id) {
  if (!photoCache.has(id)) photoCache.set(id, fetch('/api/files/' + encodeURIComponent(id), { headers: { Authorization: 'Bearer ' + (Who && Who.token) } })
    .then(r => { if (!r.ok) throw new Error(String(r.status)); return r.blob(); }).then(b => URL.createObjectURL(b))
    .catch(e => { photoCache.delete(id); throw e; }));
  return photoCache.get(id);
}
function hydratePhotos(root) {
  (root || document).querySelectorAll('img[data-photo]:not([src])').forEach(img => {
    photoURL(img.dataset.photo).then(u => { img.src = u; }).catch(() => { img.alt = 'Photo unavailable'; const p = img.closest('.ph, .ph-mini-w'); if (p) p.classList.add('ph-err'); });
  });
}
function openPhoto(id) {
  const lb = document.createElement('dialog');
  lb.className = 'lightbox';
  lb.innerHTML = '<img alt="Defect photo"><button type="button" class="icon-btn" aria-label="Close">×</button>';
  document.body.appendChild(lb);
  lb.addEventListener('click', () => lb.close());
  lb.addEventListener('close', () => lb.remove());
  photoURL(id).then(u => { lb.querySelector('img').src = u; }).catch(() => { lb.querySelector('img').alt = 'Photo unavailable'; });
  if (lb.showModal) lb.showModal(); else lb.setAttribute('open', '');
}

function askConfirm(msg, okLabel = 'OK') {
  const c = $('#cfm');
  $('#cfmText').textContent = msg;
  $('#cfmYes').textContent = okLabel;
  return new Promise(res => {
    const done = v => { c.close(); $('#cfmYes').onclick = $('#cfmNo').onclick = null; c.oncancel = null; res(v); };
    $('#cfmYes').onclick = () => done(true);
    $('#cfmNo').onclick = () => done(false);
    c.oncancel = e => { e.preventDefault(); done(false); };
    if (c.showModal) c.showModal(); else c.setAttribute('open', '');
  });
}

function rowHTML(q) {
  return `<div class="row-item"><input type="text" class="ri-label" aria-label="Qualification or membership" placeholder="e.g. Class 1 medical" value="${esc(q.label || '')}"><input type="date" class="ri-date" aria-label="Expiry date" value="${esc(q.expiry || '')}"><button type="button" class="icon-btn" data-delrow aria-label="Remove">×</button></div>`;
}
function fieldHTML(f, r) {
  const v = r[f.k];
  const id = 'f_' + f.k;
  const req = f.req ? ' <span class="req">required</span>' : '';
  const ph = f.ph ? ` placeholder="${esc(f.ph)}"` : '';
  let input = '';
  switch (f.t) {
    case 'text': input = `<input id="${id}" type="text" value="${esc(v ?? '')}"${ph}>`; break;
    case 'textarea': input = `<textarea id="${id}" rows="3"${ph}>${esc(v ?? '')}</textarea>`; break;
    case 'date': input = `<input id="${id}" type="date" value="${esc(v || '')}">`; break;
    case 'hours': input = `<div class="suffix"><input id="${id}" type="number" inputmode="decimal" step="0.1" min="0" value="${v ?? ''}"><span>hrs</span></div>`; break;
    case 'litres': input = `<div class="suffix"><input id="${id}" type="number" inputmode="numeric" step="1" min="0" value="${v ?? ''}"><span>L</span></div>`; break;
    case 'number': input = `<div class="suffix"><input id="${id}" type="number" inputmode="numeric" step="1" min="0" value="${v ?? ''}"><span>${esc(f.suffix || '')}</span></div>`; break;
    case 'select': input = `<select id="${id}">${f.o.map(([val, l]) => `<option value="${esc(val)}"${val === v ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select>`; break;
    case 'aircraft': input = `<select id="${id}">${S.aircraft.map(a => `<option value="${esc(a.id)}"${a.id === v ? ' selected' : ''}>${esc(a.ident)}${a.type ? ' (' + esc(a.type) + ')' : ''}</option>`).join('')}</select>`; break;
    case 'readonly': input = `<div class="ro">${esc(v)}</div>`; break;
    case 'photos': {
      const ids = Array.isArray(v) ? v : [];
      return `<div class="field wide"><span class="lbl">${esc(f.l)}</span><div class="ph-grid" id="${id}" data-ids="${esc(JSON.stringify(ids))}">${ids.map(phThumb).join('')}</div>
        <div class="ph-bar"><label class="btn btn-sm btn-secondary ph-add">${svgI('camera')}<span>Take or add photos</span><input type="file" accept="image/*" multiple data-photofor="${id}"></label><span class="hint ph-msg" id="${id}_msg" role="status"></span></div></div>`;
    }
    case 'rows':
      return `<div class="field wide"><span class="lbl">${esc(f.l)}</span><div class="rows" id="${id}">${(v || []).map(rowHTML).join('')}</div><div><button type="button" class="btn btn-sm btn-secondary" data-addrow="${id}">Add qualification or expiry</button></div></div>`;
  }
  const labelTag = f.t === 'readonly' ? `<span class="lbl">${esc(f.l)}</span>` : `<label for="${id}">${esc(f.l)}${req}</label>`;
  return `<div class="field${f.wide ? ' wide' : ''}">${labelTag}${input}${f.hint ? `<p class="hint">${esc(f.hint)}</p>` : ''}</div>`;
}
function collect(fields) {
  const out = {}; const errs = [];
  for (const f of fields) {
    const el = document.getElementById('f_' + f.k);
    if (!el || f.t === 'readonly') continue;
    if (f.t === 'photos') {
      if (el.dataset.busy === '1') errs.push('Wait for the photos to finish uploading.');
      try { out[f.k] = JSON.parse(el.dataset.ids || '[]'); } catch (e) { out[f.k] = []; }
      continue;
    }
    if (f.t === 'rows') {
      out[f.k] = [...el.querySelectorAll('.row-item')].map(x => ({ label: x.querySelector('.ri-label').value.trim(), expiry: x.querySelector('.ri-date').value || null })).filter(q => q.label || q.expiry);
      continue;
    }
    let val = el.value;
    if (['hours', 'litres', 'number'].includes(f.t)) {
      if (val === '') val = null;
      else {
        const n = Number(val);
        if (isNaN(n) || n < 0) { errs.push(`${f.l} must be a positive number.`); continue; }
        val = f.t === 'hours' ? Math.round(n * 10) / 10 : Math.round(n);
      }
    } else if (f.t === 'date') val = val || null;
    else if (typeof val === 'string' && f.t !== 'select' && f.t !== 'aircraft') val = val.trim();
    if (f.req && (val == null || val === '')) errs.push(`${f.l} is required.`);
    out[f.k] = val;
  }
  return { vals: out, err: errs[0] };
}

    withUndo('Deleted', () => { S[sc.coll] = S[sc.coll].filter(x => x.id !== id); });
  } });
  if (existing && sc.archivable) btns.push({ label: existing.archived ? 'Restore' : 'Archive', cls: 'btn-text', left: true, on: () => {
    closeDlg();
    withUndo(existing.archived ? 'Restored' : 'Archived', () => { existing.archived = !existing.archived; stamp(existing); });
  } });
  btns.push(cancelBtn);
  btns.push({ label: existing ? 'Save changes' : `Add ${name}`, cls: 'btn btn-primary', on: () => {
    const { vals, err } = collect(sc.fields);
    if (err) { showErr(err); return; }

    if (verr) { showErr(verr); return; }
    Object.assign(r, vals);
    delete r.example;
    if (sc.beforeSave) sc.beforeSave(r, existing);

    if (existing) { Object.keys(existing).forEach(k => { if (!(k in r)) delete existing[k]; }); Object.assign(existing, r); }
    else { r.id = uid(); r.createdAt = nowStamp(); r.archived = false; S[sc.coll].push(r); }
    closeDlg(); commit(); toast(existing ? 'Changes saved' : `${sc.title} added`);

  } });
  const title = kind === 'aircraft' ? `Update ${r.ident}` : (existing ? `Edit ${name}` : `New ${name}`);
  openDlg(title, body, btns);
}

/* Daily brief: today's aircraft, fuel, weather, actions and what's coming up, on one page.
   Print, copy or share. Built only from what's in the dashboard. */
function windSummary(raw) {
  const wd = runwayWind(' ' + raw + ' ');
  if (!wd) return '';
  if (wd.spd === 0) return 'Calm';
  if (wd.dir == null) return `Variable ${wd.spd} kt`;
  const st = S.settings, vr = Number(st.magVar ?? 11) || 0, m05 = Number(st.rwy05Mag ?? 50), m12 = Number(st.rwy12Mag ?? 120);
  const b = [['05', m05], ['23', (m05 + 180) % 360], ['12', m12], ['30', (m12 + 180) % 360]].map(([n, mh]) => { const a = (wd.dir - (mh + vr)) * Math.PI / 180; return { n, head: wd.spd * Math.cos(a), cross: wd.spd * Math.sin(a) }; }).sort((x, y) => y.head - x.head)[0];
  return `${String(wd.dir).padStart(3, '0')}° ${wd.spd} kt${wd.gust ? ` gusting ${wd.gust}` : ''} (true). Favours RWY ${b.n}: ${Math.round(b.head)} kt head, ${Math.round(Math.abs(b.cross))} kt cross${Math.abs(b.cross) >= 0.5 ? (b.cross > 0 ? ' from right' : ' from left') : ''}.`;
}
function buildBrief() {
  const now = new Date();
  const dateTxt = new Intl.DateTimeFormat('en-AU', { timeZone: TZ, weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }).format(now);
  const H = [], T = [`GoFly daily brief, ${dateTxt}`, `Prepared by ${Who ? Who.name : ''} at ${hm24(now, TZ)}`];
  const sec = (title, items) => { if (!items.length) return; H.push(`<h3 class="br-h">${esc(title)}</h3><ul class="br-l">${items.map(i => `<li>${i.h}</li>`).join('')}</ul>`); T.push('', title.toUpperCase(), ...items.map(i => '- ' + i.t)); };
  const it = (lead, rest, cls) => ({ h: `${lead ? `<b>${esc(lead)}</b> ` : ''}${cls ? `<span class="br-${cls}">` : ''}${esc(rest)}${cls ? '</span>' : ''}`, t: `${lead ? lead + ': ' : ''}${rest}` });
  sec('Aircraft', S.aircraft.map(a => {
    const u = acUse(a), nx = acSummary(a).next, f = maintForecast(a);
    const defs = S.defects.filter(d => d.aircraftId === a.id && !d.archived && d.status !== 'closed' && (d.severity === 'grounding' || d.severity === 'urgent'));
    const parts = [u.long];
    if (a.restrictions && a.status !== 'serviceable') parts.push(a.restrictions);
    if (nx) parts.push(`next ${nx.m.title}: ${nx.st.parts.map(p => p.txt).join(', ')}`);
    if (f && f.ready && !isBooked(nx && nx.m)) parts.push(f.bookNow ? 'book maintenance now (forecast)' : `book by ${fmtDate(f.bookDate)} (forecast)`);
    defs.forEach(d => { if (!parts.join(' ').includes(d.description)) parts.push(`${SEV_BADGE[d.severity][1]} defect: ${d.description}`); });
    acExpiries(a).filter(x => x.st.s !== 'ok').forEach(x => parts.push(`${x.label}: ${x.st.txt.toLowerCase()}`));
    return it(a.ident, parts.join(' · '), a.status === 'unserviceable' || defs.some(d => d.severity === 'grounding') ? 'red' : u.lvl ? 'amb' : '');
  }));
  const fr = latestReading(), o = nextOrder(), f = fuelForecast();
  sec('IOR fuel tank', [
    fr ? it('Level', `${fmtL(fr.litres)} on ${fmtDate(fr.date)}${isLowStock(fr) ? ' (low stock)' : ''}`, isLowStock(fr) ? 'red' : '') : it('Level', 'No reading yet'),
    ...(f.ready ? [it('Forecast', o ? (() => { const w = o.confirmedDate || o.requestedDate; if (!w) return 'Order placed'; const est = f.estNow - f.rate * Math.max(0, daysUntil(w)); return est > 0 ? `Order placed. About ${fmtL(est)} left when it arrives ${fmtWkDate(w)}` : `Order placed, but the tank may run low before it arrives ${fmtWkDate(w)}`; })() : f.past ? `Order now (estimated at or below ${fmtL(f.target)})` : `Order around ${fmtWkDate(f.orderDate)} · using ~${fmtL(f.rate)} a day`, !o && (f.past || f.dLeft <= 3) ? 'amb' : '')] : []),
    ...(o ? [it('On order', `${fmtL(o.litres)} ${o.product || ''}, ${o.confirmedDate ? `delivery confirmed ${fmtDate(o.confirmedDate)}` : o.requestedDate ? `requested ${fmtDate(o.requestedDate)}, not confirmed` : 'no date yet'}`)] : [])
  ]);
  const d = WX.data;
  if (d && (d.metar || d.taf)) {
    const wx = [];
    if (d.metar && d.metar.rawOb) { const ws = windSummary(d.metar.rawOb); if (ws) wx.push(it('Wind (YBSU)', ws)); wx.push(it('METAR', d.metar.rawOb)); }
    if (d.taf && d.taf.rawTAF) wx.push(it('TAF', String(d.taf.rawTAF).replace(/\s+/g, ' ')));
    wx.push(it('', 'Not an official briefing. Check NAIPS before flight.', 'mut'));
    sec('Weather', wx);
  }
  sec('Action needed', attentionItems().filter(a => ['overdue', 'due', 'alert', 'low'].includes(a.sev)).slice(0, 14).map(a => it(a.title, `${a.badge}. ${a.detail}`, a.sev === 'low' ? 'amb' : 'red')));
  sec('Next 7 days', upcoming(7).slice(0, 14).map(e => it(e.d === 0 ? 'Today' : e.d === 1 ? 'Tomorrow' : fmtWkDate(e.date), `${e.title} (${e.detail})`)));
  return { html: `<div class="brief"><p class="br-top"><b>${esc(dateTxt)}</b><br>Prepared by ${esc(Who ? Who.name : '')} at ${hm24(now, TZ)}</p>${H.join('')}</div>`, text: T.join('\n') };
}
function openBrief() {
  const b = buildBrief();
  const btns = [{ label: 'Print', cls: 'btn-text', left: true, on: () => printBrief(b.html) }];

}

function logCheck(id, kind) {
  const p = S.instructors.find(x => x.id === id); if (!p) return;

  if (!sp && !p.grade) { toast('Set the instructor grade first, under Edit details.'); return; }

  const nextTxt = sp ? `${Number(S.settings.spDays) || 90} days` : `${renewMonths(p)} months`;
  openDlg(`Log ${name}`, `<p class="hint" style="margin-bottom:12px"><strong>${esc(p.name)}</strong>${p.grade ? `, ${esc(lab(GRADES, p.grade))}` : ''}. The next one will be due ${nextTxt} after the date completed.</p>

    [{ label: 'Back', cls: 'btn btn-secondary', on: () => openInstructor(p.id) }, { label: `Save ${sp ? 'S&P check' : 'renewal'}`, cls: 'btn btn-primary', on: () => {

      });

}

/* Settings, export and import */
const dlP = (window.claude && typeof window.claude.use === 'function') ? window.claude.use('downloads').catch(() => null) : Promise.resolve(null);

async function exportData() {
  const json = JSON.stringify({ app: 'gofly-ops', schema: SCHEMA, exportedAt: nowStamp(), data: S }, null, 2);
  const filename = `gofly-ops-backup-${todayISO()}.json`;
  if (window.claude) {
    const dl = await dlP;
    if (dl) {
      try { await dl.save({ filename, data: json }); toast('Backup exported'); }
      catch (e) { if (e && e.code === 'declined') toast('Export cancelled'); else showBackupText(json); }
      return;
    }
    showBackupText(json); return;
  }
  const a = document.createElement('a');

let fuelSelId = null;
function drawFuelChart(el) {

  const Y = v => mt + ph - (v - sc.lo) / (sc.hi - sc.lo) * ph;

  const lbl = []; let lastX = -1e9;
  pts.forEach((p, i) => {
    if (i > 0 && p.date === pts[i - 1].date) return;
    const x = xs[i], first = i === 0, last = i === n - 1;
    if (!first && !last && (x - lastX < 64 || xs[n - 1] - x < 64)) return;
    lbl.push(`<text class="fc-ax" x="${x}" y="${H - 7}" text-anchor="${first ? 'start' : last ? 'end' : 'middle'}">${fmtDate(p.date).slice(0, 5)}</text>`); lastX = x;
  });
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${xs[i].toFixed(1)},${Y(lim(p.litres)).toFixed(1)}`).join('');
  const area = `${line}L${xs[n - 1].toFixed(1)},${Y(sc.lo)}L${xs[0].toFixed(1)},${Y(sc.lo)}Z`;
  const thrSvg = thr != null ? `<line class="fc-thr" x1="${ml}" x2="${W - mr}" y1="${Y(thr)}" y2="${Y(thr)}"/><text class="fc-thr-l" x="${ml + 4}" y="${Y(thr) - 5}">Reorder ${esc(fmtL(thr))}</text>` : '';
  const maxSvg = cap ? `<line class="fc-max" x1="${ml}" x2="${W - mr}" y1="${Y(cap)}" y2="${Y(cap)}"/><text class="fc-max-l" x="${ml + 4}" y="${Y(cap) - 5}">Max safe fill ${esc(fmtL(cap))}</text>` : '';

  const desc = `IOR tank readings, ${n} from ${fmtDate(pts[0].date)} to ${fmtDate(lp.date)}. Use the left and right arrow keys to step through readings.`;
  el.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" tabindex="0" aria-label="${esc(desc)}">
    <text class="fc-ax" x="0" y="11">L</text>${grid}${maxSvg}${thrSvg}<path class="fc-area" d="${area}"/><path class="fc-line" d="${line}"/>
    <line class="fc-cross" x1="${xs[si]}" x2="${xs[si]}" y1="${mt}" y2="${mt + ph}"/>${dots}<circle class="fc-sel" cx="${xs[si]}" cy="${Y(lim(sel.litres))}" r="6"/>${endLbl}${lbl.join('')}</svg>`;
  el.dataset.xs = JSON.stringify(xs.map(x => Math.round(x)));
  const rd = el.parentElement && el.parentElement.querySelector('.fc-read');
  if (rd && rd.classList.contains('fc-read')) {
    const wd = new Intl.DateTimeFormat('en-AU', { timeZone: 'UTC', weekday: 'short' }).format(new Date(sel.date + 'T00:00:00Z'));
    rd.innerHTML = `<strong>${esc(fmtL(sel.litres))}</strong><span>${esc(wd)} ${fmtDate(sel.date)}${sel.by ? `, ${esc(sel.by)}` : ''}${si === n - 1 ? ' (latest)' : ''}${thr != null && sel.litres < thr ? '. Below reorder level' : ''}</span>`;
  }
}
function bindFuelChart(el) {

// Mini level bar for the summary tile: same colours and 0 to max-safe-fill scale as the gauge.
function kpiTank(l, thr, cap) {
  if (!cap) return '';
  const pct = v => Math.max(0, Math.min(100, v / cap * 100));
  const st = l > cap ? 'over' : thr != null && l < thr ? 'low' : '';
  return `<span class="kbar" aria-hidden="true"><span class="kbar-t"><span class="kbar-f ${st}" style="width:${pct(l).toFixed(1)}%"></span>${thr != null ? `<span class="kbar-r" style="left:${pct(thr).toFixed(1)}%"></span>` : ''}</span><span class="kbar-p">${Math.round(pct(l))}% of ${Math.round(cap).toLocaleString('en-AU')} L</span></span>`;
}
function tankGauge(fr, thr, cap, H) {
  const lv = fr ? fr.litres : 0, max = cap || Math.max(lv, 1);
  const pct = v => Math.max(0, Math.min(100, v / max * 100));
  const st = !fr ? '' : cap && lv > cap ? 'over' : thr != null && lv < thr ? 'low' : '';
  const label = fr ? `${Math.round(lv / (cap || max) * 100)}%` : '—';
  return `<div class="gauge" style="height:${H}px" role="img" aria-label="IOR fuel tank ${fr ? fmtL(lv) : 'no reading'}${cap ? `, ${label} of ${fmtL(cap)} max safe fill` : ''}${thr != null ? `, reorder level ${fmtL(thr)}` : ''}">
    <div class="g-tank"><div class="g-fill ${st}" style="height:${pct(lv).toFixed(1)}%"></div>
      ${cap ? `<span class="g-ln max" style="bottom:${pct(cap).toFixed(1)}%"></span>` : ''}${thr != null ? `<span class="g-ln" style="bottom:${pct(thr).toFixed(1)}%"></span>` : ''}
</div><span class="g-pct">${label}${cap ? ' full' : ''}</span>
    <div class="g-scale" aria-hidden="true">${cap ? `<span style="bottom:${pct(cap).toFixed(1)}%"><b>${Math.round(cap).toLocaleString('en-AU')}</b>max safe</span>` : ''}${thr != null ? `<span class="thr" style="bottom:${pct(thr).toFixed(1)}%"><b>${Math.round(thr).toLocaleString('en-AU')}</b>reorder</span>` : ''}<span style="bottom:0"><b>0</b></span></div>
  </div>`;
}

function fuelFcCard(o) {
  const f = fuelForecast();
  if (!f.ready) return `<div class="fc-card"><h3 class="mini-h">Forecast <span class="n2">· guide only</span></h3><p class="empty" style="margin:0">Learning your usage. Log a few more readings and this will suggest when to order.</p></div>`;
  const when = o && (o.confirmedDate || o.requestedDate);
  let main;
  if (o) {
    const est = when ? f.estNow - f.rate * Math.max(0, daysUntil(when)) : null;
    main = when ? (est > 0 ? `Order placed. Estimated about <strong>${fmtL(est)}</strong> left when it arrives ${fmtWkDate(when)}.` : `Order placed, but the tank may run low before it arrives ${fmtWkDate(when)}.`) : 'Order placed. Add a delivery date to see the estimate on arrival.';
  } else main = f.past ? `<strong>Order now.</strong> Estimated at or below ${fmtL(f.target)}.` : `Order around <strong>${fmtWkDate(f.orderDate)}</strong> (${f.dLeft === 0 ? 'today' : `in ${plural(f.dLeft, 'day')}`}), when it reaches about ${fmtL(f.target)}.`;
  return `<div class="fc-card${!o && (f.past || f.dLeft <= 3) ? ' fc-warn' : ''}"><h3 class="mini-h">Forecast <span class="n2">· guide only</span></h3>
    <p class="fc-main">${main}</p>
    <p class="fc-sub">Estimated now ~${fmtL(f.estNow)} · using ~${fmtL(f.rate)} a day · ${f.conf === 'good' ? `learned from ${f.n} readings over ${Math.round(f.span)} days` : 'early estimate, improves as you log readings'}</p></div>`;
}
function fuelSummary(page) {
  const fr = latestReading(), thr = S.settings.fuelThreshold, cap = S.settings.tankCapacity, low = isLowStock(fr);
  const add = Number(S.settings.orderTemplate.litres) || 3500;

    ? `<div class="fchart" data-chart="fuel" data-h="${H}"></div><div class="fc-read" aria-live="polite"></div>`
    : `<div class="fchart" style="min-height:${H}px"><div class="fc-empty" style="min-height:${H}px">${n ? 'Only one reading so far. Log another reading to see how stock is changing.' : 'No readings yet. Log the tank level to start the graph.'}</div></div>`;
  const over = fr && cap ? fr.litres > cap : false;
  const after = fr ? fr.litres + add : null, afterOver = after != null && cap && after > cap;
  let order;
  if (o) {
    const st = orderStatus(o);

      <dl class="no-grid"><dt>Status</dt><dd>${esc(lab(ORDER_ST, o.status))}${st.s === 'overdue' ? ' ' + badge('overdue', st.txt) : ''}</dd>
      <dt>Requested delivery</dt><dd>${o.requestedDate ? fmtDate(o.requestedDate) : badge('missing', 'Not entered')}</dd>
      <dt>Confirmed delivery</dt><dd>${o.confirmedDate ? `<strong>${fmtDate(o.confirmedDate)}</strong> ${badge('complete', 'Confirmed')}` : badge('missing', 'Not confirmed')}</dd></dl>
      <p class="hint" style="margin-top:6px">Ordered fuel isn’t counted until it arrives. Press Refill when the delivery is in the tank.</p>`;
  } else order = `<p class="empty">No fuel on order.${low ? ' Stock is below the reorder level, so order now.' : ''}</p>`;
  return `<div class="fuel-head"><div class="fuel-fig">${fr ? Math.round(fr.litres).toLocaleString('en-AU') : '—'}<small>L</small></div>
      <div>${over ? badge('alert', 'Above max safe fill') : low ? badge('low', 'Low stock, order now') : fr && thr != null ? badge('complete', 'Above reorder level') : ''}</div></div>
    <p class="fuel-meta">${fr ? `Latest reading ${fmtDate(fr.date)} (${ageTxt})${fr.by ? ` by ${esc(fr.by)}` : ''}` : 'No reading yet'}${page ? `. Reorder at ${fmtL(thr)} <button class="btn-text" style="padding:0 0 0 4px;min-height:0" data-act="threshold">Change</button>` : ''}</p>
    <div class="tankrow">${tankGauge(fr, thr, cap, H)}<div class="tankchart">${chart}</div></div>
    <div class="fstats">
      <div><span class="k">Room to max</span><b>${fr && cap ? fmtL(Math.max(0, cap - fr.litres)) : '—'}</b></div>
      <div class="${afterOver ? 'warn' : ''}"><span class="k">After +${Math.round(add).toLocaleString('en-AU')} L refill</span><b>${after == null ? '—' : afterOver ? 'Won’t fit' : fmtL(after)}</b></div>
      <div class="${low ? 'warn' : ''}"><span class="k">Reorder at</span><b>${fmtL(thr)}</b></div>
    </div>
    <div class="btn-row"><button class="btn btn-primary" data-act="refill">Refill +${Math.round(add).toLocaleString('en-AU')} L</button><button class="btn btn-secondary" data-act="add" data-kind="reading">Log reading</button>${o ? `<button class="btn btn-secondary" data-reg="${reg(() => openEditor('order', o.id))}">Order details</button>` : `<button class="btn btn-secondary" data-act="orderTemplate">Order ${Math.round(add).toLocaleString('en-AU')} L</button>`}</div>
    ${fuelFcCard(o)}
    <div class="next-order"><h3 class="mini-h">Next order</h3>${order}</div>`;
}

// Refill: the delivery is in the tank. Logs a new reading of latest + order quantity
// (3,500 L by default) and marks the open order delivered.
async function refill() {
  const fr = latestReading(), add = Number(S.settings.orderTemplate.litres) || 3500, cap = S.settings.tankCapacity, o = nextOrder();
  if (!fr) { openEditor('reading', null, { notes: `Refill +${add} L` }); toast('No earlier reading. Enter the tank level after the refill.'); return; }
  const after = fr.litres + add;
  if (cap && after > cap) {
    if (await askConfirm(`A ${fmtL(add)} refill won’t fit. The tank has ${fmtL(fr.litres)} and holds a maximum of ${fmtL(cap)}, so there’s room for ${fmtL(Math.max(0, cap - fr.litres))}. Log the actual level instead?`, 'Log actual level'))
      openEditor('reading', null, { notes: 'Refill' });
    return;
  }
  const msg = `Log a ${fmtL(add)} refill now? The IOR tank goes from ${fmtL(fr.litres)} to ${fmtL(after)}.`
    + (o ? ` The ${fmtL(o.litres)} order${o.supplier ? ' from ' + o.supplier : ''} will be marked delivered.` : '');
  if (!(await askConfirm(msg, `Refill +${Math.round(add).toLocaleString('en-AU')} L`))) return;
  withUndo('Refill logged', () => {
    const now = nowStamp(), who = S.settings.userName || '';
    S.fuelReadings.push({ id: uid(), date: todayISO(), litres: after, by: who, notes: `Refill +${add} L${o && o.supplier ? ', ' + o.supplier + ' delivery' : ''}`, createdAt: now, updatedAt: now, updatedBy: who, archived: false });
    if (o) { o.status = 'delivered'; if (!o.confirmedDate) o.confirmedDate = todayISO(); delete o.example; stamp(o); }
  });
}

/* ---------- Weather: YBSU METAR and TAF from the Worker route /api/wx ---------- */
const WX_ID = 'YBSU';
const WX = { status: 'idle', data: null, at: 0 };
const hm24 = (d, tz) => new Intl.DateTimeFormat('en-GB', { timeZone: tz, hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).format(d);
const lday = d => new Intl.DateTimeFormat('en-AU', { timeZone: TZ, weekday: 'short', day: '2-digit', month: '2-digit' }).format(d);
const lwk = d => new Intl.DateTimeFormat('en-AU', { timeZone: TZ, weekday: 'short' }).format(d);
const agoTxt = d => { const m = Math.round((Date.now() - d) / 60000); return m < 1 ? 'just now' : m < 60 ? `${m} min ago` : `${Math.floor(m / 60)} h ${m % 60} min ago`; };
const toDate = v => v == null || v === '' ? null : typeof v === 'number' ? new Date(v < 1e12 ? v * 1000 : v) : isNaN(Date.parse(v)) ? null : new Date(v);
function ddhh(dd, hh, mm, ref) {
  const r = ref || new Date();
  const mk = k => new Date(Date.UTC(r.getUTCFullYear(), r.getUTCMonth() + k, +dd, +hh, +(mm || 0)));
  let d = mk(0);
  if (d - r > 15 * 864e5) d = mk(-1); else if (r - d > 15 * 864e5) d = mk(1);
  return d;
}
function decodeMetar(raw) {
  const f = [], hz = [];
  const w = raw.match(/\b(\d{3}|VRB)(\d{2,3})(?:G(\d{2,3}))?KT\b/);
  if (w) {
    f.push(['Wind', +w[2] === 0 && w[1] === '000' ? 'Calm' : `${w[1] === 'VRB' ? 'Variable' : w[1] + '°'} ${+w[2]} kt${w[3] ? `, gusts ${+w[3]}` : ''}`]);
    if (w[3] && +w[3] >= 25) hz.push('Strong gusts');
  }
  if (/\bCAVOK\b/.test(raw)) f.push(['Visibility', 'CAVOK']);
  else { const v = raw.match(/KT\s+(?:\d{3}V\d{3}\s+)?(\d{4})(?:NDV)?\b/); if (v) f.push(['Visibility', +v[1] >= 9999 ? '10 km or more' : +v[1] >= 5000 ? `${+v[1] / 1000} km` : `${+v[1]} m`]); }
  const cl = [...raw.matchAll(/\b(FEW|SCT|BKN|OVC)(\d{3})(CB|TCU)?\b/g)].map(m => `${m[1]} ${(+m[2] * 100).toLocaleString('en-AU')} ft${m[3] ? ' ' + m[3] : ''}`);
  if (cl.length) f.push(['Cloud', cl.join(', ')]); else if (/\b(NSC|SKC|NCD|CLR)\b/.test(raw)) f.push(['Cloud', 'No significant cloud']);
  const t = raw.match(/\s(M?\d{2})\/(M?\d{2})?(?=\s)/), c = x => x ? (x[0] === 'M' ? -Number(x.slice(1)) : Number(x)) : null;
  if (t) f.push(['Temp / dew point', `${c(t[1])}° / ${t[2] ? c(t[2]) + '°' : '—'}`]);
  const q = raw.match(/\bQ(\d{4})\b/); if (q) f.push(['QNH', `${+q[1]} hPa`]);
  const body = raw.split(/\sRMK\s/)[0];
  const wx = body.match(/\s((?:[+-]|VC)?(?:TS|SH|FZ|BL|DR|MI|BC|PR)?(?:RA|DZ|SN|GR|GS|FG|BR|HZ|FU|DU|SA|SQ|PL|IC)+|[+-]?TS)(?=\s|$)/);
  if (wx) f.push(['Weather', wx[1]]);
  if (/\b[+-]?(VC)?TS|CB\b/.test(body)) hz.push('Thunderstorm or CB');
  if (/\bTCU\b/.test(body)) hz.push('Towering cumulus');
  if (/\bFG\b/.test(body)) hz.push('Fog');
  return { f, hz };
}
function tafLines(raw, ref) {
  const [main, rmk] = raw.replace(/^TAF\s+(AMD\s+|COR\s+)?/, '').trim().split(/\s+RMK\s+/);
  const span = p => { const g = p.match(/\b(\d{2})(\d{2})\/(\d{2})(\d{2})\b/); if (!g) return ''; const a = ddhh(g[1], g[2], 0, ref), b = ddhh(g[3], g[4], 0, ref); return `${lwk(a)} ${hm24(a, TZ)}–${hm24(b, TZ)}`; };
  const out = main.split(/\s+(?=(?:FM\d{6}|BECMG|TEMPO|INTER|PROB\d{2})\b)/).map((p, i) => {
    let m;
    if (i === 0) return { label: 'Main forecast', cls: 'base', text: p };
    if ((m = p.match(/^FM(\d{2})(\d{2})(\d{2})/))) { const d = ddhh(m[1], m[2], m[3], ref); return { label: `From ${lwk(d)} ${hm24(d, TZ)}`, cls: 'fm', text: p }; }
    if (/^BECMG/.test(p)) return { label: `Becoming ${span(p)}`, cls: 'fm', text: p };
    if (/^TEMPO/.test(p)) return { label: `Temporarily ${span(p)}`, cls: 'tempo', text: p };
    if (/^INTER/.test(p)) return { label: `Intermittently ${span(p)}`, cls: 'tempo', text: p };
    if ((m = p.match(/^PROB(\d{2})/))) return { label: `${m[1]}% chance ${span(p)}`, cls: 'tempo', text: p };
    return { label: '', cls: 'fm', text: p };
  });
  if (rmk) out.push({ label: 'Remarks', cls: 'rmk', text: 'RMK ' + rmk });
  return out;
}
/* YCDR runway wind diagram, built from the YBSU METAR wind (degrees true).
   Runways 05/23 and 12/30, both 735 m, drawn to scale north-up. The crossing point is roughly
   41% along 05/23 from the 05 end and 68% along 12/30 from the 12 end, as on the aerodrome chart. */
const RWY_LEN = 735;
function runwayWind(raw) {
  const w = raw.match(/\b(\d{3}|VRB)(\d{2,3})(?:G(\d{2,3}))?KT\b/);
  if (!w) return null;
  const v = raw.match(/KT\s+(\d{3})V(\d{3})\b/);
  return { dir: w[1] === 'VRB' ? null : +w[1], spd: +w[2], gust: w[3] ? +w[3] : null, vary: v ? [+v[1], +v[2]] : null };
}
function windDiagram(raw) {
  const wd = runwayWind(raw);
  if (!wd) return '';
  const st = S.settings, vr = Number(st.magVar ?? 11) || 0;
  const m05 = Number(st.rwy05Mag ?? 50), m12 = Number(st.rwy12Mag ?? 120);
  const ends = [  // name, magnetic heading
    ['05', m05], ['23', (m05 + 180) % 360], ['12', m12], ['30', (m12 + 180) % 360]];
  const calm = wd.spd === 0, vrb = wd.dir == null;
  // Components for each runway end (true wind vs true runway heading)
  const comp = ends.map(([n, mh]) => {
    const a = (wd.dir - (mh + vr)) * Math.PI / 180;
    return { n, head: wd.spd * Math.cos(a), cross: wd.spd * Math.sin(a), gh: wd.gust != null ? wd.gust * Math.cos(a) : null, gx: wd.gust != null ? wd.gust * Math.sin(a) : null };
  });
  const pick = (a, b) => (comp[a].head >= comp[b].head ? comp[a] : comp[b]);
  const best = calm || vrb ? [] : [pick(0, 1), pick(2, 3)];
  const fav = best.length ? (best[0].head >= best[1].head ? best[0].n : best[1].n) : null;

  // Geometry, north-up, true headings
  const C = 75, R = 70;
  const vec = deg => { const r = deg * Math.PI / 180; return [Math.sin(r), -Math.cos(r)]; };
  const rw = [[m05 + vr, 0.41, '05', '23'], [m12 + vr, 0.68, '12', '30']].map(([h, f, a, b]) => {
    const [ux, uy] = vec(h);
    return { a, b, ux, uy, s: [-f * ux, -f * uy], e: [(1 - f) * ux, (1 - f) * uy] };
  });
  const pts = rw.flatMap(r => [r.s, r.e]);
  const cx = (Math.min(...pts.map(q => q[0])) + Math.max(...pts.map(q => q[0]))) / 2;
  const cy = (Math.min(...pts.map(q => q[1])) + Math.max(...pts.map(q => q[1]))) / 2;
  const span = Math.max(...pts.map(q => Math.hypot(q[0] - cx, q[1] - cy)));
  const k = 36 / span;  // runway ends sit well inside the ring, leaving room for numbers and the arrow
  const P = q => [C + (q[0] - cx) * k, C + (q[1] - cy) * k];
  const half = 4.5;
  let g = '';
  rw.forEach(r => {
    const [sx, sy] = P(r.s), [ex, ey] = P(r.e), nx = -r.uy * half, ny = r.ux * half;
    g += `<polygon class="wnd-rwy" points="${[[sx + nx, sy + ny], [ex + nx, ey + ny], [ex - nx, ey - ny], [sx - nx, sy - ny]].map(q => q.map(v => v.toFixed(1)).join(',')).join(' ')}"/>`;
    g += `<line class="wnd-cl" x1="${(sx + r.ux * 3).toFixed(1)}" y1="${(sy + r.uy * 3).toFixed(1)}" x2="${(ex - r.ux * 3).toFixed(1)}" y2="${(ey - r.uy * 3).toFixed(1)}"/>`;
    [[r.a, sx, sy, -1], [r.b, ex, ey, 1]].forEach(([n, x, y, d]) => {
      const tx = x + d * r.ux * 11, ty = y + d * r.uy * 11 + 4.5, isFav = n === fav;
      if (isFav) g += `<line class="wnd-thr" x1="${(x + nx * 1.5).toFixed(1)}" y1="${(y + ny * 1.5).toFixed(1)}" x2="${(x - nx * 1.5).toFixed(1)}" y2="${(y - ny * 1.5).toFixed(1)}"/>`;
      g += `<text class="wnd-num${isFav ? ' fav' : ''}" x="${tx.toFixed(1)}" y="${ty.toFixed(1)}" text-anchor="middle">${n}</text>`;
    });
  });
  // Compass ring, north tick
  let ring = `<circle class="wnd-ring" cx="${C}" cy="${C}" r="${R}"/><line class="wnd-tick" x1="${C}" y1="${C - R - 3}" x2="${C}" y2="${C - R + 4}"/><text class="wnd-n" x="${C}" y="${C - R + 14}" text-anchor="middle">N</text>`;
  // Varying sector (e.g. 100V160) as an arc on the ring
  if (wd.vary) {
    const [a1, a2] = wd.vary, sweep = ((a2 - a1) + 360) % 360;
    const [x1, y1] = vec(a1), [x2, y2] = vec(a2);
    ring += `<path class="wnd-vary" d="M${(C + x1 * R).toFixed(1)},${(C + y1 * R).toFixed(1)} A${R},${R} 0 ${sweep > 180 ? 1 : 0} 1 ${(C + x2 * R).toFixed(1)},${(C + y2 * R).toFixed(1)}"/>`;
  }
  // Wind arrow: from the ring at the wind's direction, pointing in towards the field
  let arrow = '';
  if (!calm && !vrb) {
    const [ux, uy] = vec(wd.dir), o = R + 4, i = R - 19;
    const tipX = C + ux * i, tipY = C + uy * i, px = -uy, py = ux;
    arrow = `<line class="wnd-arrow" x1="${(C + ux * o).toFixed(1)}" y1="${(C + uy * o).toFixed(1)}" x2="${(C + ux * (i + 8)).toFixed(1)}" y2="${(C + uy * (i + 8)).toFixed(1)}"/>
      <polygon class="wnd-head" points="${tipX.toFixed(1)},${tipY.toFixed(1)} ${(tipX + ux * 11 + px * 6).toFixed(1)},${(tipY + uy * 11 + py * 6).toFixed(1)} ${(tipX + ux * 11 - px * 6).toFixed(1)},${(tipY + uy * 11 - py * 6).toFixed(1)}"/>`;
  }
  const kt = v => Math.round(Math.abs(v));
  const row = c => {
    const x = kt(c.cross), side = c.cross > 0.5 ? 'from right' : c.cross < -0.5 ? 'from left' : '';
    const hw = kt(c.head) === 0 ? 'no headwind' : c.head > 0 ? `${kt(c.head)} kt head` : `${kt(c.head)} kt tail`;
    const gust = c.gh != null ? ` <span class="muted">(gusts ${kt(c.gh)} ${c.gh >= 0 ? 'head' : 'tail'}, ${kt(c.gx)} cross)</span>` : '';
    return `<div class="wnd-r${c.n === fav ? ' fav' : ''}"><b>RWY ${c.n}</b><span>${hw} · ${x ? `${x} kt cross ${side}` : 'no crosswind'}${gust}</span></div>`;
  };
  const windTxt = calm ? 'Calm' : vrb ? `Variable ${wd.spd} kt` : `${String(wd.dir).padStart(3, '0')}° ${wd.spd} kt${wd.gust ? ` gusting ${wd.gust}` : ''}`;
  const aria = `Wind ${windTxt}${fav ? `, favours runway ${fav}` : ''}`;
  return `<div class="wx-col wx-wind"><div class="wx-h"><span class="wx-tag">WIND</span><span class="wx-when">YBSU wind on YCDR runways</span></div>
    <div class="wnd"><svg viewBox="0 0 150 150" role="img" aria-label="${esc(aria)}">${ring}${g}${arrow}</svg>
    <div><div class="wnd-w">${esc(windTxt)} <small>${calm || vrb ? '' : 'true'}${wd.vary ? `, varying ${String(wd.vary[0]).padStart(3, '0')}–${String(wd.vary[1]).padStart(3, '0')}°` : ''}</small></div>
      ${calm ? '<div class="wnd-r"><span>Calm: no headwind or crosswind.</span></div>' : vrb ? '<div class="wnd-r"><span>Direction variable, so components can’t be worked out.</span></div>' : best.sort((a, b) => b.head - a.head).map(row).join('')}</div></div>
    <p class="wnd-note">Measured at Sunshine Coast, not Caloundra. Runways ${String(m05).padStart(3, '0')}°/${String(m12).padStart(3, '0')}° M, variation ${vr}° E.</p></div>`;
}

function wxBody() {
  const d = WX.data;
  if (!d) return WX.status === 'error'
    ? `<div class="wx-empty"><p>${WX_ID} weather couldn’t be loaded right now. Check NAIPS.</p><button class="btn btn-sm btn-secondary" data-act="wxRetry">Try again</button></div>`
    : `<div class="wx-empty"><p>Loading ${WX_ID} weather…</p></div>`;
  const m = d.metar, t = d.taf;
  let mh, th, wind = '';
  if (m && (m.rawOb || m.rawText)) {
    const raw = String(m.rawOb || m.rawText).trim();

      ${tzHz.length ? `<div class="wx-hz">${tzHz.map(h => badge('hz', 'Forecast: ' + h)).join('')}</div>` : ''}
      <div>${lines.map(l => `<div class="tl ${l.cls}"><span class="tl-l">${esc(l.label)}</span><span class="tl-t">${esc(l.text)}</span></div>`).join('')}</div></div>`;

    <div class="wx-foot"><span>${WX.status === 'error' ? 'Latest update failed, showing the last report. ' : ''}From aviationweather.gov, checked ${hm24(new Date(WX.at), TZ)}. Not an official briefing: check NAIPS before flight.</span><button class="btn-text" data-act="wxRetry">Refresh</button></div>`;

function paintWx() { const el = document.getElementById('wx-body'); if (el) el.innerHTML = wxBody(); }
async function loadWx() {
  if (WX.status === 'loading') return;
  WX.status = 'loading'; if (!WX.data) paintWx();
  try {
    const r = await fetch(`/api/wx?ids=${WX_ID}`, { headers: { Accept: 'application/json' }, cache: 'no-store' });
    const j = await r.json();
    if (!r.ok || j.error) throw new Error(j.error || 'HTTP ' + r.status);

}

    const defs = allD.filter(d => showAcDone || (!d.archived && d.status !== 'closed')).sort((a, b) => String(b.raised || '').localeCompare(String(a.raised || '')));

    const use = acUse(ac);
    return `<section class="ac st-${esc(use.cls)}" id="acsec-${esc(ac.ident)}">
      <div class="ac-head">
        <div class="ac-id"><span class="id">${esc(ac.ident)}</span>${ac.type ? `<span class="ty">${esc(ac.type)}</span>` : ''}${exChip(ac)}</div>
        <div class="ac-state"><span class="stt">${esc(use.long)}</span>${use.lvl && use.lvl !== 'overdue' ? `<span class="muted" style="display:block">${fmtH(use.rem)} hrs to the next hour-based maintenance item</span>` : ''}${ac.restrictions ? `<span class="restr">${esc(ac.restrictions)}</span>` : '<span class="muted">No restrictions recorded</span>'}
          <span class="ac-next"><span class="k">Next maintenance:</span>${nx ? `<strong>${esc(nx.m.title)}</strong> ${nx.st.parts.map(p => badge(p.s, p.txt)).join(' ')}` : '<span class="muted">None entered</span>'}</span>${(() => { const f = maintForecast(ac); return f ? `<span class="mc-fc" style="margin-top:6px">${esc(maintFcText(f, hourItemFor(ac).m))}</span>` : ''; })()}</div>
        <dl class="ctr"><div><dt>Engine hours</dt><dd>${ac.engineHours != null ? fmtH(ac.engineHours) : badge('missing', 'Not entered')}</dd></div><div><dt>Air time</dt><dd>${ac.airTime != null ? fmtH(ac.airTime) : '<span class="na muted">Not tracked</span>'}</dd></div></dl>
        <div class="ac-act"><button class="btn btn-sm btn-secondary" data-reg="${reg(() => openEditor('aircraft', ac.id))}">Update record</button></div>
        <div class="ac-exp">${acExpiries(ac).map(x => `<span><span class="k">${esc(x.label)}</span> ${x.st.due ? fmtDate(x.st.due) + ' ' : ''}${x.st.s === 'ok' ? `<span class="ist ist-ok">${esc(x.st.txt)}</span>` : badge(x.st.s, x.st.txt)}</span>`).join('')}</div>
        <p class="ac-meta">Responsible: ${ac.responsible ? esc(ac.responsible) : badge('missing', 'Not set')}. Updated ${ac.updatedAt ? fmtStamp(ac.updatedAt) + (ac.updatedBy ? ' by ' + esc(ac.updatedBy) : '') : 'never'}.</p>
      </div>
      ${ac.notes ? `<div class="ac-notes"><strong>Maintenance notes:</strong> ${esc(ac.notes)}</div>` : ''}
      <div class="ac-body">
        <div class="sub"><div class="sub-h"><h3>Maintenance due</h3><button class="btn-text" data-act="add" data-kind="maint" data-ac="${esc(ac.id)}">Add item</button></div>
          ${maint.length ? maint.map(recMaint).join('') : '<p class="empty">No open maintenance items. Add the next inspection so hours remaining show here.</p>'}
          ${!showAcDone && all.length > maint.length ? `<p class="meta">${all.length - maint.length} completed or archived hidden</p>` : ''}</div>
        <div class="sub"><div class="sub-h"><h3>Defects and follow-up</h3><button class="btn-text" data-act="add" data-kind="defect" data-ac="${esc(ac.id)}">Report defect</button></div>
          ${defs.length ? defs.map(recDefect).join('') : '<p class="empty">No open defects.</p>'}
          ${!showAcDone && allD.length > defs.length ? `<p class="meta">${allD.length - defs.length} closed or archived hidden</p>` : ''}</div>
      </div>
    </section>`;
  }).join('');
  return `${banners()}<div class="view-h"><h1>Aircraft</h1><div class="view-actions">
    <button class="btn btn-primary" data-act="hours">Update hours</button>
    <button class="btn btn-secondary" data-act="add" data-kind="maint">Add maintenance item</button>
    <button class="btn btn-secondary" data-act="add" data-kind="defect">Report defect</button>
    <button class="btn btn-secondary" data-act="warnings">Warning levels</button>
    <label class="tog"><input type="checkbox" data-act="toggleAcDone"${showAcDone ? ' checked' : ''}> Show completed and archived</label>
  </div></div>${secs}`;
}

function renderFuel() {
  const t = S.settings.orderTemplate;
  const orders = S.fuelOrders.filter(o => showFuelDone || (!o.archived && !['delivered', 'cancelled'].includes(o.status)))
    .sort((a, b) => String(b.orderedDate || b.createdAt || '').localeCompare(String(a.orderedDate || a.createdAt || '')));
  const hiddenOrders = S.fuelOrders.length - orders.length;
  const issues = S.fuelIssues.filter(i => showFuelDone || (!i.archived && i.status !== 'resolved'));
  const readings = [...S.fuelReadings].sort((a, b) => String(b.date).localeCompare(String(a.date)) || String(b.createdAt).localeCompare(String(a.createdAt)));

  const orderRows = orders.length ? orders.map(o => {
    const st = orderStatus(o);
    const active = !['delivered', 'cancelled'].includes(o.status) && !o.archived;
    return `<div class="rec${o.archived ? ' is-arch' : ''}">
      <button class="rec-main" data-reg="${reg(() => openEditor('order', o.id))}"><span class="t">${fmtL(o.litres)} ${esc(o.product || '')}${o.supplier ? `, ${esc(o.supplier)}` : ''}${exChip(o)}</span>
        <span class="d">${esc(lab(ORDER_ST, o.status))}. Ordered ${fmtDate(o.orderedDate)}. Requested ${fmtDate(o.requestedDate)}. ${o.confirmedDate ? `Confirmed ${fmtDate(o.confirmedDate)}.` : 'Not yet confirmed.'}</span>
        ${o.notes ? `<span class="n">${esc(o.notes)}</span>` : ''}</button>
      <span class="rec-side">${badge(st.s, st.txt)}${active ? `<button class="btn btn-sm btn-secondary" data-reg="${reg(() => showMessage(o))}">Order message</button><button class="btn btn-sm btn-secondary" data-reg="${reg(() => markDelivered(o))}">Mark delivered</button>` : ''}</span>
    </div>`;
  }).join('') : '<p class="empty">No open fuel orders.</p>';

  const issueRows = issues.length ? issues.map(i => `<div class="rec${i.archived ? ' is-arch' : ''}">
      <button class="rec-main" data-reg="${reg(() => openEditor('issue', i.id))}"><span class="t">${esc(i.title)}${exChip(i)}</span><span class="d">${esc(i.equipment || '')}, reported ${fmtDate(i.reported)}</span>${i.notes ? `<span class="n">${esc(i.notes)}</span>` : ''}</button>
      <span class="rec-side">${i.status === 'resolved' ? badge('complete', 'Resolved') : i.status === 'waiting' ? badge('waiting', `Waiting on ${i.waitingOn || 'someone else'}`) : badge('info', 'Open')}${i.status !== 'resolved' && !i.archived ? `<button class="btn btn-sm btn-secondary" data-reg="${reg(() => withUndo('Issue resolved', () => { i.status = 'resolved'; delete i.example; stamp(i); }))}">Resolve</button>` : ''}</span>
    </div>`).join('') : '<p class="empty">No open bowser or pump issues.</p>';

  const histRows = readings.slice(0, 12).map((r, idx) => {
    const prev = readings[idx + 1];
    const diff = prev ? r.litres - prev.litres : null;
    return `<tr><td><button class="btn-text" style="padding:0" data-reg="${reg(() => openEditor('reading', r.id))}">${fmtDate(r.date)}</button>${exChip(r)}</td><td class="num">${fmtL(r.litres)}</td><td class="num">${diff == null ? '—' : (diff > 0 ? '+' : diff < 0 ? '−' : '') + fmtL(Math.abs(diff))}</td><td>${esc(r.by || '')}</td></tr>`;
  }).join('');

  return `${banners()}<div class="view-h"><h1>Fuel</h1><div class="view-actions">
      <button class="btn btn-primary" data-act="add" data-kind="reading">Log reading</button>
      <button class="btn btn-secondary" data-act="orderTemplate">Order ${Math.round(Number(S.settings.orderTemplate.litres) || 3500).toLocaleString('en-AU')} L</button>
      <button class="btn btn-secondary" data-act="add" data-kind="issue">Report bowser or pump issue</button>
      <label class="tog"><input type="checkbox" data-act="toggleFuelDone"${showFuelDone ? ' checked' : ''}> Show delivered and resolved</label>
    </div></div>
    <div class="grid">
      <section class="panel span-5"><div class="panel-h"><h2>${ICO('drop')}IOR fuel tank</h2></div>${fuelSummary(true)}</section>
      <section class="panel span-7"><div class="panel-h"><h2>${ICO('receipt')}Fuel orders</h2><span class="sub">${hiddenOrders > 0 && !showFuelDone ? `${hiddenOrders} delivered or archived hidden` : ''}</span></div>
        <div class="tmpl"><div><span class="t">Standard order: ${fmtL(t.litres)} ${esc(t.product)}${t.supplier ? ` from ${esc(t.supplier)}` : ''}</span>${t.notes ? `<span class="d">${esc(t.notes)}</span>` : ''}</div>
          <div class="btn-row" style="margin:0"><button class="btn btn-sm btn-primary" data-act="orderTemplate">New order</button><button class="btn btn-sm btn-secondary" data-act="editTemplate">Edit template</button><button class="btn-text" data-act="add" data-kind="order">Other order</button></div></div>
        ${orderRows}</section>
      <section class="panel span-6"><div class="panel-h"><h2>${ICO('wrench')}Bowser and pump issues</h2><button class="btn-text" data-act="add" data-kind="issue">Report issue</button></div>${issueRows}</section>
      <section class="panel span-6"><div class="panel-h"><h2>${ICO('clock')}Reading history</h2><span class="sub">${readings.length ? `Latest ${Math.min(12, readings.length)}` : ''}</span></div>
        ${readings.length ? `<div class="scroll-x"><table class="hist"><thead><tr><th>Date</th><th class="num">Reading</th><th class="num">Change</th><th>Read by</th></tr></thead><tbody>${histRows}</tbody></table></div>` : '<p class="empty">No readings yet. Log the bulk tank level to start tracking stock.</p>'}</section>
    </div>`;
}

function insCell(p, kind) {
  const sp = kind === 'sp', st = sp ? checkState(p) : renewState(p), last = sp ? p.lastCheck : p.lastRenewal;
  if (st.na) return `<div class="ins-c ins-na"><span class="ins-l">S&amp;P check</span><span class="ins-due muted">Not required</span><span class="ins-last">Juniors only</span></div>`;
  return `<div class="ins-c"><span class="ins-l">${sp ? 'S&P check' : esc(renewalName(p))}</span>
    <span class="ins-due">${st.due ? fmtDate(st.due) : '—'} ${st.s === 'ok' ? `<span class="ist ist-ok">${esc(st.txt)}</span>` : badge(st.s, st.txt)}</span>
    <span class="ins-last">Last ${last ? fmtDate(last) : 'not entered'}${!sp && p.renewalExpiry ? ', certificate expiry' : ''}</span></div>`;
}
function renderInstructors() {
  const list = S.instructors.filter(p => showInstArch || !p.archived).sort(sortInst);
  const act = S.instructors.filter(p => !p.archived);

        <span class="ins-meta"><span class="cchip">${esc(GRADE_SHORT[p.grade] || 'Grade not set')}</span>${p.raausNo ? `<span>RAAus ${esc(p.raausNo)}</span>` : ''}${p.archived ? '<span>Archived</span>' : ''}</span>
        ${p.restrictions ? `<span class="ins-q">Restriction: ${esc(trunc(p.restrictions, 60))}</span>` : ''}</button>
      ${insCell(p, 'sp')}${insCell(p, 'renewal')}
      <div class="ins-c ins-ex"><span class="ins-l">Membership and medical</span>${ex.filter(x => !x.st.na).map(x => `<span class="ex-r"><span class="dot dot-${x.st.s === 'ok' ? 'ok-g' : x.st.s}"></span><span class="ex-n">${esc(x.label === 'RAAus membership' ? 'RAAus' : x.label === 'CASA medical' ? 'Medical' : x.label)}</span><span class="ex-d ist-${x.st.s}">${x.st.due ? fmtDate(x.st.due) : 'Not entered'}</span></span>`).join('')}</div>
      <div class="ins-a">${needsSP(p) ? `<button class="btn btn-sm btn-secondary" data-reg="${reg(() => logCheck(p.id, 'sp'))}">+ S&amp;P check</button>` : ''}<button class="btn btn-sm btn-secondary" data-reg="${reg(() => logCheck(p.id, 'renewal'))}">+ ${esc(renewShort(p))}</button></div></div>`;
  }).join('');
  return `${banners()}<div class="view-h"><h1>Instructors</h1><div class="view-actions">
    <button class="btn btn-primary" data-act="add" data-kind="instructor">Add instructor</button>
    <label class="tog"><input type="checkbox" data-act="toggleInstArch"${showInstArch ? ' checked' : ''}> Show archived</label></div></div>
    <div class="fstats ins-sum">${tile('S&P overdue', cnt(sps, 'overdue'), 'warn')}${tile(`S&P due within ${Number(S.settings.dueSoonDays) || 14} days`, cnt(sps, 'soon'), 'soonc')}${tile('Renewals / SI reviews overdue', cnt(rns, 'overdue'), 'warn')}${tile(`Renewals / SI reviews due within ${Number(S.settings.renewWarnDays ?? 30)} days`, cnt(rns, 'soon'), 'soonc')}${tile('Membership, medical or expiry to check', act.reduce((n, p) => n + instExpiries(p).filter(x => x.st.s !== 'ok').length, 0), 'warn')}</div>
    ${list.length ? `<div class="ins"><div class="ins-row ins-hd" aria-hidden="true"><span></span><span>Instructor</span><span>S&amp;P check (juniors, every ${Number(S.settings.spDays) || 90} days)</span><span>Renewal or SI flight review</span><span>Membership and medical</span><span></span></div>${rows}</div>`
      : '<div class="panel"><p class="empty">No instructors yet. Add each instructor with their grade and last check dates.</p></div>'}
    <p class="hint" style="margin-top:10px">Sorted with the most urgent first. Select a name to open the profile and check history.</p>`;
}

let docFilter = 'all';
function docReviewed(d) {
  if (d.kind === 'review' && Number(d.reviewMonths) > 0) {
    withUndo('Marked reviewed', () => { d.lastReviewed = todayISO(); d.date = addMonths(todayISO(), Number(d.reviewMonths)); delete d.example; stamp(d); });
  } else {
    openEditor('doc', d.id, null);
    toast(d.kind === 'expiry' ? 'Enter the new expiry date and save.' : 'Enter the next review date and save.');
  }
}
function renderDocs() {
  const all = S.documents.filter(d => !d.archived);
  const sts = all.map(docState);
  const n = s => sts.filter(x => x.s === s).length;
  const tile = (k, v, cls) => `<div class="${v ? cls : ''}"><span class="k">${k}</span><b>${v}</b></div>`;
  const list = all.filter(d => docFilter === 'all' || d.category === docFilter)
    .sort((a, b) => { const x = docState(a), y = docState(b); return RANK[x.s] - RANK[y.s] || (x.d ?? 1e6) - (y.d ?? 1e6) || String(a.title).localeCompare(String(b.title)); });
  const cats = DOC_CATS.filter(([k]) => all.some(d => d.category === k));
  const rows = list.map(d => {
    const st = docState(d);
    return `<li class="doc-row"><span class="mk mk-${st.s}"></span>
      <button type="button" class="doc-main" data-reg="${reg(() => openEditor('doc', d.id))}"><span class="t">${esc(d.title)}${exChip(d)}</span>
        <span class="doc-meta"><span class="cchip">${esc(lab(DOC_CATS, d.category))}</span>${d.reference ? `<span>${esc(d.reference)}</span>` : ''}${d.responsible ? `<span>${esc(d.responsible)}</span>` : ''}</span>
        ${d.notes ? `<span class="n muted">${esc(trunc(d.notes, 120))}</span>` : ''}</button>
      <div class="doc-when"><span class="ins-l">${d.kind === 'expiry' ? 'Expires' : 'Next review'}</span><span class="ins-due">${st.due ? fmtDate(st.due) : '—'} ${st.s === 'ok' ? `<span class="ist ist-ok">${esc(st.txt)}</span>` : badge(st.s, st.txt)}</span>
        <span class="ins-last">${d.lastReviewed ? `Last ${d.kind === 'expiry' ? 'renewed' : 'reviewed'} ${fmtDate(d.lastReviewed)}` : ''}${d.reviewMonths ? `${d.lastReviewed ? ' · ' : ''}every ${d.reviewMonths} months` : ''}</span></div>
      <div class="ins-a"><button class="btn btn-sm btn-secondary" data-reg="${reg(() => docReviewed(d))}">${d.kind === 'expiry' ? 'Renewed' : 'Mark reviewed'}</button></div></li>`;
  }).join('');
  const acx = S.aircraft.flatMap(a => acExpiries(a).filter(x => x.st.s !== 'ok').map(x => ({ a, x })));
  return `${banners()}<div class="view-h"><h1>Documents and compliance</h1><div class="view-actions">
    <button class="btn btn-primary" data-act="add" data-kind="doc">Add document</button></div></div>
    <div class="fstats ins-sum doc-sum">${tile('Expired or review overdue', n('overdue'), 'warn')}${tile(`Due within ${Number(S.settings.docWarnDays ?? 30)} days`, n('soon'), 'soonc')}${tile('Date not entered', n('missing'), 'soonc')}${tile('In date', n('ok'), '')}</div>
    ${cats.length > 1 ? `<div class="toolbar"><span class="seg" role="group" aria-label="Type"><button type="button" data-act="docCat" data-c="all" aria-pressed="${docFilter === 'all'}">All (${all.length})</button>${cats.map(([k, l]) => `<button type="button" data-act="docCat" data-c="${k}" aria-pressed="${docFilter === k}">${esc(l)}</button>`).join('')}</span></div>` : ''}
    ${list.length ? `<ul class="docs">${rows}</ul>` : `<div class="panel"><p class="empty">${all.length ? 'Nothing of this type.' : 'No documents yet. Add your manuals, procedures, forms, approvals and insurance with their expiry or review dates.'}</p></div>`}
    ${acx.length ? `<section class="panel" style="margin-top:16px"><div class="panel-h"><h2>${ICO('plane')}Aircraft registration and insurance</h2><button class="btn-text" data-act="go" data-view="aircraft">Aircraft</button></div>
      <ul class="list">${acx.map(({ a, x }) => `<li><button class="irow" data-reg="${reg(() => openEditor('aircraft', a.id))}"><span class="mk mk-${x.st.s}"></span><span><span class="nm">${esc(a.ident)} ${esc(x.label.toLowerCase())}</span><span class="dt">${x.st.due ? `Expires ${fmtDate(x.st.due)}` : 'Expiry not entered'}</span></span><span class="ist ist-${x.st.s}">${esc(x.st.txt)}</span></button></li>`).join('')}</ul></section>` : ''}
    <p class="hint" style="margin-top:10px">Sorted with the most urgent first. Instructor memberships and medicals are on the Instructors page.</p>`;
}

function renderTasks() {
  const counts = {
    open: S.tasks.filter(t => !t.archived && t.status !== 'done').length,
    waiting: S.tasks.filter(t => !t.archived && t.status === 'waiting').length,
    done: S.tasks.filter(t => !t.archived && t.status === 'done').length,
    archived: S.tasks.filter(t => t.archived).length
  };
  const segs = [['open', 'Open'], ['waiting', 'Waiting'], ['done', 'Complete'], ['archived', 'Archived']]
    .map(([k, l]) => `<button type="button" data-act="taskStatus" data-s="${k}" aria-pressed="${taskFilter.status === k}">${l} (${counts[k]})</button>`).join('');
  return `${banners()}<div class="view-h"><h1>Tasks</h1><div class="view-actions">
    <button class="btn btn-primary" data-act="add" data-kind="task">Add task</button>
    ${counts.done ? '<button class="btn btn-secondary" data-act="archiveDone">Archive completed</button>' : ''}</div></div>
    <div class="toolbar"><span class="seg" role="group" aria-label="Status">${segs}</span>
      <select id="taskCat" aria-label="Category"><option value="all">All categories</option>${CATS.map(([v, l]) => `<option value="${esc(v)}"${taskFilter.cat === v ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select>
      <input type="search" id="taskQ" placeholder="Search tasks" aria-label="Search tasks" value="${esc(taskFilter.q)}"></div>
    <ul class="tasklist" id="taskList"></ul>`;
}
function renderTaskList() {
  const el = $('#taskList'); if (!el) return;
  const q = taskFilter.q.trim().toLowerCase();
  const list = S.tasks.filter(t => {
    if (taskFilter.status === 'open' && (t.archived || t.status === 'done')) return false;
    if (taskFilter.status === 'waiting' && (t.archived || t.status !== 'waiting')) return false;
    if (taskFilter.status === 'done' && (t.archived || t.status !== 'done')) return false;
    if (taskFilter.status === 'archived' && !t.archived) return false;
    if (taskFilter.cat !== 'all' && t.category !== taskFilter.cat) return false;
    if (q && ![t.title, t.owner, t.notes, t.waitingOn, t.category].join(' ').toLowerCase().includes(q)) return false;
    return true;
  }).sort((a, b) => String(a.due || '9999').localeCompare(String(b.due || '9999')) || (PRIO_RANK[a.priority] ?? 2) - (PRIO_RANK[b.priority] ?? 2));
  if (!list.length) { el.innerHTML = `<li class="task"><p class="empty" style="margin:0">${q || taskFilter.cat !== 'all' ? 'No tasks match these filters.' : taskFilter.status === 'open' ? 'No open tasks. Add one when something needs doing.' : 'Nothing here.'}</p></li>`; return; }
  el.innerHTML = list.map(t => {
    const done = t.status === 'done';
    const meta = [t.category, t.owner ? `Owner: ${t.owner}` : 'No owner', t.updatedBy ? `Last change by ${t.updatedBy}` : '', t.status === 'waiting' ? `Waiting on ${t.waitingOn || 'someone else'}` : (t.status === 'progress' ? 'In progress' : '')].filter(Boolean).join('. ');
    return `<li class="task${done ? ' is-done' : ''}">
      <button type="button" class="chk" aria-pressed="${done}" aria-label="${done ? 'Mark not complete' : 'Mark complete'}: ${esc(t.title)}" data-reg="${reg(() => withUndo(done ? 'Task reopened' : 'Task complete', () => { t.status = done ? 'todo' : 'done'; if (!done) t.completedAt = nowStamp(); else delete t.completedAt; delete t.example; stamp(t); }))}"></button>
      <button type="button" class="task-main" data-reg="${reg(() => openEditor('task', t.id))}"><span class="t">${esc(t.title)}${exChip(t)}</span><span class="d">${esc(meta)}</span>${t.notes ? `<span class="n">${esc(trunc(t.notes, 160))}</span>` : ''}</button>
      <span class="task-side"><span>${t.due ? fmtDate(t.due) : ''}</span>${done ? badge('complete', t.completedAt ? `Complete ${fmtDate(new Intl.DateTimeFormat('en-CA', { timeZone: TZ }).format(new Date(t.completedAt)))}` : 'Complete') : t.due ? dueBadge(t.due) : badge('missing', 'No due date')}${t.status === 'waiting' && !done ? badge('waiting', 'Waiting') : ''}${!done && (t.priority === 'urgent' || t.priority === 'high') ? `<span class="pr pr-${t.priority}">${lab(PRIOS, t.priority)} priority</span>` : ''}</span>
    </li>`;
  }).join('');
}

/* ---------- Routing, actions, start-up ---------- */
const main = $('#main');
function render() {
  R = [];
  if (!Who) { main.innerHTML = ''; return; }
  const fn = { overview: renderOverview, aircraft: renderAircraft, fuel: renderFuel, instructors: renderInstructors, tasks: renderTasks, docs: renderDocs }[view];
  main.innerHTML = fn();
  if (view === 'tasks') renderTaskList();
  drawCharts();
  hydratePhotos(main);
  updateTabs();
  if (pendingScroll) { const el = document.getElementById(pendingScroll); pendingScroll = null; if (el) el.scrollIntoView({ block: 'start' }); }
}
function updateTabs() {
  $$('.tabs a').forEach(a => { if (a.dataset.view === view) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  // Same source as the overview cards, so the numbers always agree.
  const c = { overview: 0, aircraft: 0, fuel: 0, instructors: 0, tasks: 0, docs: 0 };
  attentionItems().forEach(a => { if (a.sev === 'overdue') c.overview++; if (['overdue', 'due', 'alert', 'low'].includes(a.sev)) c[a.area]++; });
  $$('.tabs .count').forEach(el => { const k = el.dataset.count, v = c[k]; el.textContent = v ? String(v) : ''; el.setAttribute('aria-label', v ? (k === 'overview' ? `${v} overdue` : `${v} need action`) : ''); });
}
function route() {
  const h = location.hash.replace('#', '');
  view = VIEWS.includes(h) ? h : 'overview';
  if (dlg.open) closeDlg();
  render();
  if (!pendingScroll) window.scrollTo(0, 0);
}
function go(v) { if (location.hash === '#' + v) { render(); window.scrollTo(0, 0); } else location.hash = v; }
function goAircraft(ident) { pendingScroll = 'acsec-' + ident; go('aircraft'); }
window.addEventListener('hashchange', route);

const ACT = {
  add: d => openEditor(d.kind, null, d.ac ? { aircraftId: d.ac } : null),
  hours: openHours,
  orderTemplate: orderFromTemplate,
  editTemplate: openTemplate,
  threshold: openThreshold,
  settings: openSettings,
  export: exportData,
  clearEx: async () => { if (await askConfirm(`Remove all records marked Example?${syncMeta().synced ? ' This removes them for everyone.' : ''} Your own records stay.`, 'Clear example data')) withUndo('Example data cleared', clearExamples); },
  toggleAtt: () => { showAllAtt = !showAllAtt; render(); },
  addMenu: openAddMenu,
  brief: () => openBrief(),
  docCat: d => { docFilter = d.c; render(); },
  lock: () => lockApp(),
  syncNow: () => { syncTick().then(() => toast(Sync.state === 'ok' ? 'Synced with everyone' : Sync.state === 'local' ? 'Not connected to the shared database. Saved on this device.' : 'Offline. Changes are saved here and will sync later.')); },
  refill: () => refill(),
  wxRetry: () => { WX.status = WX.status === 'loading' ? 'loading' : 'idle'; loadWx(); },
  warnings: openWarnings,
  kpiOverdue: () => { if (!showAllAtt && attentionItems().filter(a => a.sev === 'overdue').length > 5) { showAllAtt = true; render(); } ACT.scroll({ id: 'p-attention' }); },
  up: d => { upWindow = Number(d.days); render(); },
  scroll: d => { const el = document.getElementById(d.id); if (el) el.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' }); },
  go: d => go(d.view),
  toggleAcDone: () => { showAcDone = !showAcDone; render(); },
  toggleFuelDone: () => { showFuelDone = !showFuelDone; render(); },
  toggleInstArch: () => { showInstArch = !showInstArch; render(); },
  taskStatus: d => { taskFilter.status = d.s; render(); },
  archiveDone: async () => {
    const n = S.tasks.filter(t => !t.archived && t.status === 'done').length;
    if (!(await askConfirm(`Archive ${plural(n, 'completed task')}? You can find them under Archived.`, 'Archive'))) return;
    withUndo(`${plural(n, 'task')} archived`, () => S.tasks.forEach(t => { if (!t.archived && t.status === 'done') { t.archived = true; stamp(t); } }));
  }
};
document.addEventListener('click', e => {
  const r = e.target.closest('[data-reg]');
  if (r && main.contains(r)) { e.preventDefault(); const f = R[Number(r.dataset.reg)]; if (f) f(); return; }
  const a = e.target.closest('[data-act]');
  if (a && !dlg.contains(a)) { if (a.tagName === 'A') e.preventDefault(); const f = ACT[a.dataset.act]; if (f) f(a.dataset, a); }
});
main.addEventListener('change', e => { if (e.target.id === 'taskCat') { taskFilter.cat = e.target.value; renderTaskList(); } });
main.addEventListener('focusout', () => { if (renderWaiting) setTimeout(() => { if (renderWaiting) scheduleRender(); }, 300); });
main.addEventListener('input', e => { if (e.target.id === 'taskQ') { taskFilter.q = e.target.value; renderTaskList(); } });

window.addEventListener('storage', e => {
  if (e.key === SYNC_KEY) Sync.meta = null;
  if (e.key === KEY && e.newValue && !dlg.open) { try { S = normalise(JSON.parse(e.newValue)); applyTheme(); render(); } catch (_) {} }
});

let lastDay = todayISO();
const clockStr = (d, tz) => new Intl.DateTimeFormat('en-GB', { timeZone: tz, hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23' }).format(d);
const utcDay = d => new Intl.DateTimeFormat('en-AU', { timeZone: 'UTC', weekday: 'short', day: '2-digit', month: '2-digit' }).format(d).replace(',', '');
function tick() {
  const now = new Date();
  const dd = new Intl.DateTimeFormat('en-AU', { timeZone: TZ, weekday: 'short', day: '2-digit', month: '2-digit' }).format(now).replace(',', '');
  const loc = clockStr(now, TZ), utc = clockStr(now, 'UTC');
  $$('[data-clk="localday"]').forEach(e => { e.textContent = dd; });
  $$('[data-clk="local"]').forEach(e => { e.textContent = loc; });
  $$('[data-clk="utc"]').forEach(e => { e.textContent = utc; });
  $$('[data-clk="utcday"]').forEach(e => { e.textContent = utcDay(now); });
  if (now.getSeconds() === 0 && WX.data) paintWx();  // keep "x min ago" current
  const d = todayISO();
  if (d !== lastDay) { lastDay = d; if (!dlg.open) render(); }
}

(function init() {
  const raw = Store.adapter.load();
  if (raw) S = normalise(raw);
  else { S = emptyState(); applyExamples(); }
  persist();
  applyTheme();
  tick(); setInterval(tick, 1000);
  route();
  loadWx(); setInterval(loadWx, 5 * 60 * 1000);
  showLogin();
  setInterval(() => { if (!document.hidden) syncTick(); }, 20000);
  window.addEventListener('focus', () => syncTick());
  window.addEventListener('online', () => syncTick());
  document.addEventListener('visibilitychange', () => { if (!document.hidden) syncTick(); });
  document.addEventListener('visibilitychange', () => { if (!document.hidden && Date.now() - WX.at > 2 * 60 * 1000) loadWx(); });
})();
</script>
</body>
</html>
