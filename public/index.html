/* ---------- Forms and dialogs ---------- */
const dlg = $('#dlg');
function openDlg(title, html, buttons) {
  $('#dlgTitle').textContent = title;
  $('#dlgBody').innerHTML = html;
  const foot = $('#dlgFoot');
  foot.innerHTML = '';
  const left = document.createElement('div');
  left.className = 'foot-left';
  foot.appendChild(left);
  buttons.forEach(b => {
    const el = document.createElement('button');
    el.type = 'button';
    el.className = b.cls || 'btn btn-secondary';
    el.textContent = b.label;
    el.addEventListener('click', b.on);
    (b.left ? left : foot).appendChild(el);
  });
  if (!dlg.open) { if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open', ''); }
  $('#dlgBody').scrollTop = 0;
  if (!matchMedia('(max-width:760px)').matches) {
    const first = $('#dlgBody').querySelector('input:not([type=hidden]):not([type=file]),select,textarea');
    if (first) first.focus();
  }
}
function closeDlg() { if (dlg.open) dlg.close(); }
const cancelBtn = { label: 'Cancel', cls: 'btn btn-secondary', on: () => closeDlg() };
$('#dlgClose').addEventListener('click', closeDlg);
dlg.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.matches('input:not([type=file])') && !e.isComposing) {
    e.preventDefault();
    const p = $('#dlgFoot .btn-primary'); if (p) p.click();
  }
});
dlg.addEventListener('click', e => {
  const add = e.target.closest('[data-addrow]');
  if (add) { const box = document.getElementById(add.dataset.addrow); box.insertAdjacentHTML('beforeend', rowHTML({})); box.lastElementChild.querySelector('input').focus(); return; }
  const del = e.target.closest('[data-delrow]');
  if (del) del.closest('.row-item').remove();
});

function askConfirm(msg, okLabel = 'OK') {
  const c = $('#cfm');
  $('#cfmText').textContent = msg;
  $('#cfmYes').textContent = okLabel;
  return new Promise(res => {
    const done = v => { c.close(); $('#cfmYes').onclick = $('#cfmNo').onclick = null; c.oncancel = null; res(v); };
    $('#cfmYes').onclick = () => done(true);
    $('#cfmNo').onclick = () => done(false);
    c.oncancel = e => { e.preventDefault(); done(false); };
    if (c.showModal) c.showModal(); else c.setAttribute('open', '');
  });
}

function rowHTML(q) {
  return `<div class="row-item"><input type="text" class="ri-label" aria-label="Qualification or membership" placeholder="e.g. Class 1 medical" value="${esc(q.label || '')}"><input type="date" class="ri-date" aria-label="Expiry date" value="${esc(q.expiry || '')}"><button type="button" class="icon-btn" data-delrow aria-label="Remove">×</button></div>`;
}
function fieldHTML(f, r) {
  const v = r[f.k];
  const id = 'f_' + f.k;
  const req = f.req ? ' <span class="req">required</span>' : '';
  const ph = f.ph ? ` placeholder="${esc(f.ph)}"` : '';
  let input = '';
  switch (f.t) {
    case 'text': input = `<input id="${id}" type="text" value="${esc(v ?? '')}"${ph}>`; break;
    case 'textarea': input = `<textarea id="${id}" rows="3"${ph}>${esc(v ?? '')}</textarea>`; break;
    case 'date': input = `<input id="${id}" type="date" value="${esc(v || '')}">`; break;
    case 'hours': input = `<div class="suffix"><input id="${id}" type="number" inputmode="decimal" step="0.1" min="0" value="${v ?? ''}"><span>hrs</span></div>`; break;
    case 'litres': input = `<div class="suffix"><input id="${id}" type="number" inputmode="numeric" step="1" min="0" value="${v ?? ''}"><span>L</span></div>`; break;
    case 'number': input = `<div class="suffix"><input id="${id}" type="number" inputmode="numeric" step="1" min="0" value="${v ?? ''}"><span>${esc(f.suffix || '')}</span></div>`; break;
    case 'select': input = `<select id="${id}">${f.o.map(([val, l]) => `<option value="${esc(val)}"${val === v ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select>`; break;
    case 'aircraft': input = `<select id="${id}">${S.aircraft.map(a => `<option value="${esc(a.id)}"${a.id === v ? ' selected' : ''}>${esc(a.ident)}${a.type ? ' (' + esc(a.type) + ')' : ''}</option>`).join('')}</select>`; break;
    case 'readonly': input = `<div class="ro">${esc(v)}</div>`; break;
    case 'rows':
      return `<div class="field wide"><span class="lbl">${esc(f.l)}</span><div class="rows" id="${id}">${(v || []).map(rowHTML).join('')}</div><div><button type="button" class="btn btn-sm btn-secondary" data-addrow="${id}">Add qualification or expiry</button></div></div>`;
  }
  const labelTag = f.t === 'readonly' ? `<span class="lbl">${esc(f.l)}</span>` : `<label for="${id}">${esc(f.l)}${req}</label>`;
  return `<div class="field${f.wide ? ' wide' : ''}">${labelTag}${input}${f.hint ? `<p class="hint">${esc(f.hint)}</p>` : ''}</div>`;
}
function collect(fields) {
  const out = {}; const errs = [];
  for (const f of fields) {
    const el = document.getElementById('f_' + f.k);
    if (!el || f.t === 'readonly') continue;
    if (f.t === 'rows') {
      out[f.k] = [...el.querySelectorAll('.row-item')].map(x => ({ label: x.querySelector('.ri-label').value.trim(), expiry: x.querySelector('.ri-date').value || null })).filter(q => q.label || q.expiry);
      continue;
    }
    let val = el.value;
    if (['hours', 'litres', 'number'].includes(f.t)) {
      if (val === '') val = null;
      else {
        const n = Number(val);
        if (isNaN(n) || n < 0) { errs.push(`${f.l} must be a positive number.`); continue; }
        val = f.t === 'hours' ? Math.round(n * 10) / 10 : Math.round(n);
      }
    } else if (f.t === 'date') val = val || null;
    else if (typeof val === 'string' && f.t !== 'select' && f.t !== 'aircraft') val = val.trim();
    if (f.req && (val == null || val === '')) errs.push(`${f.l} is required.`);
    out[f.k] = val;
  }
  return { vals: out, err: errs[0] };
}
function showErr(msg) { const e = $('#formErr'); if (e) { e.textContent = msg; e.hidden = false; } }

function openEditor(kind, id, defaults) {
  const sc = SCHEMAS[kind];
  const list = S[sc.coll];
  const existing = id ? list.find(x => x.id === id) : null;
  if (id && !existing) { toast('That record no longer exists.'); return; }
  const r = existing ? { ...existing } : { ...(sc.defaults ? sc.defaults() : {}), ...(defaults || {}) };
  const name = sc.title.charAt(0).toLowerCase() + sc.title.slice(1);
  const body = `${existing && existing.example ? '<p class="note-ex">This is example data. When you save changes it becomes your own record.</p>' : ''}
    <div class="form">${sc.fields.map(f => fieldHTML(f, r)).join('')}</div>
    ${existing && existing.updatedAt ? `<p class="meta" style="margin-top:14px">Last updated ${fmtStamp(existing.updatedAt)}${existing.updatedBy ? ' by ' + esc(existing.updatedBy) : ''}</p>` : ''}
    <p class="form-err" id="formErr" hidden></p>`;
  const btns = [];
  if (existing && sc.deletable !== false) btns.push({ label: 'Delete', cls: 'btn-text danger', left: true, on: async () => {
    if (!(await askConfirm(`Delete this ${name}? Archive it instead if you want to keep the history.`, 'Delete'))) return;
    closeDlg();
    withUndo('Deleted', () => { S[sc.coll] = S[sc.coll].filter(x => x.id !== id); });
  } });
  if (existing && sc.archivable) btns.push({ label: existing.archived ? 'Restore' : 'Archive', cls: 'btn-text', left: true, on: () => {
    closeDlg();
    withUndo(existing.archived ? 'Restored' : 'Archived', () => { existing.archived = !existing.archived; stamp(existing); });
  } });
  btns.push(cancelBtn);
  btns.push({ label: existing ? 'Save changes' : `Add ${name}`, cls: 'btn btn-primary', on: () => {
    const { vals, err } = collect(sc.fields);
    if (err) { showErr(err); return; }
    const verr = sc.validate ? sc.validate(vals) : '';
    if (verr) { showErr(verr); return; }
    Object.assign(r, vals);
    delete r.example;
    if (sc.beforeSave) sc.beforeSave(r, existing);
    stamp(r);
    if (existing) { Object.keys(existing).forEach(k => { if (!(k in r)) delete existing[k]; }); Object.assign(existing, r); }
    else { r.id = uid(); r.createdAt = nowStamp(); r.archived = false; S[sc.coll].push(r); }
    closeDlg(); commit(); toast(existing ? 'Changes saved' : `${sc.title} added`);
  } });
  const title = kind === 'aircraft' ? `Update ${r.ident}` : (existing ? `Edit ${name}` : `New ${name}`);
  openDlg(title, body, btns);
}

function openHours() {
  const rows = S.aircraft.map(a => `<div class="hrow"><div class="hid">${esc(a.ident)}<span class="muted">${a.updatedAt ? 'Updated ' + fmtStamp(a.updatedAt) : 'Not updated yet'}</span></div>
    <label>Engine hours<div class="suffix"><input type="number" inputmode="decimal" step="0.1" min="0" data-h="engineHours" data-id="${esc(a.id)}" value="${a.engineHours ?? ''}"><span>hrs</span></div></label>
    <label>Air time<div class="suffix"><input type="number" inputmode="decimal" step="0.1" min="0" data-h="airTime" data-id="${esc(a.id)}" value="${a.airTime ?? ''}"><span>hrs</span></div></label></div>`).join('');
  let confirmLower = false;
  openDlg('Update aircraft hours', `<p class="hint">Engine hours and air time are separate counters. Leave air time blank for aircraft that don’t use it.</p>${rows}<p class="form-err" id="formErr" hidden></p>`, [cancelBtn, { label: 'Save hours', cls: 'btn btn-primary', on: () => {
    const changes = [], lower = [];
    for (const inp of $$('#dlgBody input[data-h]')) {
      const a = acById(inp.dataset.id), k = inp.dataset.h;
      let v = inp.value === '' ? null : Number(inp.value);
      if (v != null && (isNaN(v) || v < 0)) { showErr(`Check the ${k === 'engineHours' ? 'engine hours' : 'air time'} for ${a.ident}.`); return; }
      if (v != null) v = Math.round(v * 10) / 10;
      if (v !== a[k]) { if (v != null && a[k] != null && v < a[k]) lower.push(`${a.ident} ${k === 'engineHours' ? 'engine hours' : 'air time'}`); changes.push([a, k, v]); }
    }
    if (lower.length && !confirmLower) { confirmLower = true; showErr(`Lower than the last recorded figure: ${lower.join(', ')}. Check the numbers, then select Save hours again to confirm.`); return; }
    closeDlg();
    if (!changes.length) { toast('No changes to save'); return; }
    changes.forEach(([a, k, v]) => { a[k] = v; delete a.example; stamp(a); });
    commit();
    toast(`Hours updated for ${plural(new Set(changes.map(c => c[0].ident)).size, 'aircraft').replace('aircrafts', 'aircraft')}`);
  } }]);
}

/* Settings, export and import */
const dlP = (window.claude && typeof window.claude.use === 'function') ? window.claude.use('downloads').catch(() => null) : Promise.resolve(null);

async function exportData() {
  const json = JSON.stringify({ app: 'gofly-ops', schema: SCHEMA, exportedAt: nowStamp(), data: S }, null, 2);
  const filename = `gofly-ops-backup-${todayISO()}.json`;
  if (window.claude) {
    const dl = await dlP;
    if (dl) {
      try { await dl.save({ filename, data: json }); toast('Backup exported'); }
      catch (e) { if (e && e.code === 'declined') toast('Export cancelled'); else showBackupText(json); }
      return;
    }
    showBackupText(json); return;
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([json], { type: 'application/json' }));
  a.download = filename;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
  toast('Backup exported');
}
function showBackupText(json) {
  openDlg('Backup', `<p class="hint" style="margin-bottom:10px">Downloads aren’t available here. Copy this text and save it as a .json file to keep your backup.</p><textarea class="msg" id="msgText" readonly>${esc(json)}</textarea>`,
    [cancelBtn, { label: 'Copy backup', cls: 'btn btn-primary', on: async () => {
      const ta = $('#msgText');
      try { await navigator.clipboard.writeText(ta.value); toast('Backup copied'); } catch (e) { ta.focus(); ta.select(); toast('Select all and copy the text'); }
    } }]);
}
$('#importFile').addEventListener('change', async e => {
  const f = e.target.files[0]; e.target.value = '';
  if (!f) return;
  let j;
  try { j = JSON.parse(await f.text()); } catch (err) { toast('That file couldn’t be read. Choose a .json backup from this dashboard.'); return; }
  const data = j && j.app === 'gofly-ops' && j.data ? j.data : j;
  if (!data || !Array.isArray(data.aircraft)) { toast('That file isn’t a GoFly Ops backup.'); return; }
  const when = j.exportedAt ? ` from ${fmtStamp(j.exportedAt)}` : '';
  if (!(await askConfirm(`Replace everything on this dashboard with the backup${when}? Export a backup first if you want to keep what’s here now.`, 'Replace with backup'))) return;
  S = normalise(data); applyTheme(); closeDlg(); commit(); toast('Backup imported');
});

function openSettings() {
  const s = S.settings;
  const status = Store.ok
    ? `Saved in ${Store.adapter.name}${S.meta.savedAt ? `, last at ${fmtStamp(S.meta.savedAt)}` : ''}. Export a backup regularly, and before clearing browser data or switching devices.`
    : 'This browser isn’t saving changes. Export a backup before you close the page.';
  const body = `<div class="form">${SCHEMAS.settings.fields.map(f => fieldHTML(f, s)).join('')}</div><p class="form-err" id="formErr" hidden></p>
    <h3 class="dlg-sec">Your data</h3>
    <p class="hint">${esc(status)}</p>
    <div class="btn-row">
      <button type="button" class="btn btn-secondary" id="xExport">Export backup</button>
      <button type="button" class="btn btn-secondary" id="xImport">Import backup</button>
      ${hasExamples() ? '<button type="button" class="btn btn-secondary" id="xClear">Clear example data</button>' : '<button type="button" class="btn btn-secondary" id="xLoad">Load example data</button>'}
      <button type="button" class="btn-text danger" id="xReset">Erase everything</button>
    </div>`;
  openDlg('Data and settings', body, [cancelBtn, { label: 'Save settings', cls: 'btn btn-primary', on: () => {
    const { vals, err } = collect(SCHEMAS.settings.fields);
    if (err) { showErr(err); return; }

  } }]);
  $('#xExport').onclick = exportData;

    if (!(await askConfirm('Remove all records marked Example? Your own records stay.', 'Clear example data'))) return;
    closeDlg(); withUndo('Example data cleared', clearExamples);
  };
  if ($('#xLoad')) $('#xLoad').onclick = () => { closeDlg(); withUndo('Example data loaded', applyExamples); };
  $('#xReset').onclick = async () => {
    if (!(await askConfirm('Erase every record and setting on this dashboard? Export a backup first if you might need it.', 'Erase everything'))) return;
    closeDlg(); withUndo('Everything erased', () => { S = emptyState(); });
  };
}
function applyTheme() {
  const t = S.settings.theme;
  if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
  else delete document.documentElement.dataset.theme;
}

/* Toast */
let toastTimer;
function toast(msg, undo) {
  const t = $('#toast');
  t.innerHTML = `<span>${esc(msg)}</span>${undo ? '<button type="button" class="toast-undo">Undo</button>' : ''}`;
  t.classList.add('show');
  if (undo) t.querySelector('.toast-undo').onclick = () => { t.classList.remove('show'); undo(); toast('Undone'); };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), undo ? 7000 : 2800);
}

/* Charts. Bars use HTML so they reflow; the fuel line is SVG drawn at the
   container's real width (see drawCharts) so its text stays a readable size. */
function niceStep(raw) { const p = Math.pow(10, Math.floor(Math.log10(raw))); const f = raw / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; }
function niceScale(lo, hi, n) {
  if (!(hi > lo)) hi = lo + 1;
  const st = niceStep((hi - lo) / n), a = Math.floor(lo / st) * st, b = Math.ceil(hi / st) * st, t = [];
  for (let v = a; v <= b + st / 2; v += st) t.push(Math.round(v * 100) / 100);
  return { lo: a, hi: b, ticks: t };
}
const fmtTick = v => Number(v).toLocaleString('en-AU', { maximumFractionDigits: 1 }).replace('-', '−');

function maintChart() {
  const rows = S.aircraft.map(ac => ({ ac, h: hourItemFor(ac), warn: warnFor(ac) }));
  const vals = rows.filter(r => r.h.rem != null).map(r => r.h.rem);
  const warns = rows.filter(r => r.h.rem != null && r.warn != null).map(r => r.warn * 2);
  const sc = niceScale(Math.min(0, ...vals), Math.max(10, ...vals, ...warns), 4);
  const P = v => (v - sc.lo) / (sc.hi - sc.lo) * 100;
  const body = rows.map(({ ac, h, warn }) => {
    const st = h.rem == null ? 'missing' : hoursState(h.rem, warn);
    let bar;
    if (h.rem == null) bar = '<span class="mc-na"></span>';
    else {
      const a = P(Math.min(0, h.rem)), b = P(Math.max(0, h.rem));
      bar = `<span class="mc-bar${st === 'ok' ? '' : ' ' + st}${h.rem < 0 ? ' neg' : ''}" style="left:${a.toFixed(2)}%;width:${(b - a).toFixed(2)}%"></span>`;
    }
    const zero = sc.lo < 0 ? `<span class="mc-zero" style="left:${P(0).toFixed(2)}%"></span>` : '';
    const tick = h.rem != null && warn != null && warn <= sc.hi ? `<span class="mc-warn" style="left:${P(warn).toFixed(2)}%"></span>` : '';
    const val = h.rem == null ? 'Not entered' : h.rem < 0 ? `${fmtH(-h.rem)} hrs overdue` : `${fmtH(h.rem)} hrs left`;
    const sub = h.m
      ? `<span class="cchip">${esc(lab(COUNTERS, h.m.counter))}</span><span class="t2">${esc(h.m.title)}</span><span>${h.rem == null ? esc(h.why) : `due at ${fmtH(h.m.dueHours)}, now ${fmtH(h.cur)}`}${h.m.dueDate ? `, or by ${fmtDate(h.m.dueDate)}` : ''}${h.others ? `. ${h.others} more item${h.others === 1 ? '' : 's'}` : ''}</span>`
      : `<span>${esc(h.why)}</span>`;
    const fn = h.m ? (h.rem == null ? () => openHours() : () => openEditor('maint', h.m.id)) : () => openEditor('maint', null, { aircraftId: ac.id, counter: 'engine' });
    const aria = `${ac.ident}, ${AC_SHORT[ac.status] || ac.status}. ${val}${h.m ? `, ${lab(COUNTERS, h.m.counter)}, ${h.m.title}` : ''}${st === 'soon' ? ', approaching' : st === 'overdue' ? ', overdue' : ''}`;
    return `<button type="button" class="mc-row" data-reg="${reg(fn)}" aria-label="${esc(aria)}">
      <span class="mc-top"><span class="mc-who"><span class="mc-id">${esc(ac.ident)}</span><span class="mc-st"><span class="dot dot-${esc(ac.status)}"></span>${esc(AC_SHORT[ac.status] || ac.status)}</span></span>
        <span class="mc-val${h.rem == null ? ' na' : ''}">${val}</span></span>
      <span class="mc-track" aria-hidden="true">${zero}${bar}${tick}</span>
      <span class="mc-sub">${sub}</span></button>`;
  }).join('');
  const axis = `<div class="mc-axis" aria-hidden="true">${sc.ticks.map((t, i) => `<span style="left:${P(t).toFixed(2)}%">${fmtTick(t)}${i === sc.ticks.length - 1 ? ' hrs' : ''}</span>`).join('')}</div>`;
  const cal = S.maintenance.filter(m => !m.archived && m.status !== 'done' && m.counter === 'none')
    .sort((a, b) => String(a.dueDate || '9').localeCompare(String(b.dueDate || '9')));
  const calHTML = `<div class="mc-cal"><h3 class="mini-h">Calendar-only items</h3>${cal.length ? `<ul class="list">${cal.map(m => {
    const ac = acById(m.aircraftId), s = dateStatus(m.dueDate);
    return `<li><button class="item" data-reg="${reg(() => openEditor('maint', m.id))}"><span class="mk mk-${s}"></span><span class="tx"><span class="t">${ac ? esc(ac.ident) + ' ' : ''}${esc(m.title)}</span><span class="d">${m.dueDate ? `Due ${fmtDate(m.dueDate)}` : 'Due date not entered'}${m.bookingDate ? `, booked ${fmtDate(m.bookingDate)}` : ''}</span></span><span class="r">${m.dueDate ? (s === 'ok' ? `<span class="ist ist-ok">${esc(dueText(m.dueDate))}</span>` : badge(s, dueText(m.dueDate))) : badge('missing', 'Not entered')}</span></button></li>`;
  }).join('')}</ul>` : '<p class="empty">No calendar-only maintenance items.</p>'}</div>`;
  const own = S.aircraft.filter(a => a.hoursWarn != null).length;
  return `<div class="mc-legend" aria-hidden="true"><span><i class="sw"></i>On track</span><span><i class="sw sw-soon"></i>Approaching</span><span><i class="sw sw-overdue"></i>Overdue</span><span><i class="sw sw-tick"></i>Warning level</span></div>

}

function fuelSeries() {
  return S.fuelReadings.filter(r => !r.archived && r.date && r.litres != null)
    .sort((a, b) => String(a.date).localeCompare(String(b.date)) || String(a.createdAt).localeCompare(String(b.createdAt))).slice(-24);
}
let fuelSelId = null;
function drawFuelChart(el) {
  const pts = fuelSeries(), n = pts.length;
  if (n < 2 || !el.isConnected) return;
  const W = Math.max(160, el.clientWidth), H = Number(el.dataset.h) || 190;
  const thr = S.settings.fuelThreshold, cap = S.settings.tankCapacity;
  const ml = 42, mr = 12, mt = 22, mb = 26, pw = W - ml - mr, ph = H - mt - mb;
  // Same 0 to max-safe-fill scale as the tank gauge, so their lines line up.
  const sc = cap ? niceScale(0, cap, 5) : niceScale(0, Math.max(...pts.map(p => p.litres), thr || 0) * 1.04, 4);
  const lim = v => cap ? Math.min(v, cap) : v;
  const t0 = Date.parse(pts[0].date), t1 = Date.parse(pts[n - 1].date), same = t1 === t0;
  const xs = pts.map((p, i) => ml + (same ? i / (n - 1) : (Date.parse(p.date) - t0) / (t1 - t0)) * pw);
  const Y = v => mt + ph - (v - sc.lo) / (sc.hi - sc.lo) * ph;
  let si = pts.findIndex(p => p.id === fuelSelId); if (si < 0) si = n - 1;
  const sel = pts[si];
  const grid = sc.ticks.map(t => `<line class="fc-grid" x1="${ml}" x2="${W - mr}" y1="${Y(t)}" y2="${Y(t)}"/><text class="fc-ax" x="${ml - 6}" y="${Y(t) + 4}" text-anchor="end">${fmtTick(t)}</text>`).join('');
  const lbl = []; let lastX = -1e9;
  pts.forEach((p, i) => {
    if (i > 0 && p.date === pts[i - 1].date) return;
    const x = xs[i], first = i === 0, last = i === n - 1;
    if (!first && !last && (x - lastX < 64 || xs[n - 1] - x < 64)) return;
    lbl.push(`<text class="fc-ax" x="${x}" y="${H - 7}" text-anchor="${first ? 'start' : last ? 'end' : 'middle'}">${fmtDate(p.date).slice(0, 5)}</text>`); lastX = x;
  });
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${xs[i].toFixed(1)},${Y(lim(p.litres)).toFixed(1)}`).join('');
  const area = `${line}L${xs[n - 1].toFixed(1)},${Y(sc.lo)}L${xs[0].toFixed(1)},${Y(sc.lo)}Z`;
  const thrSvg = thr != null ? `<line class="fc-thr" x1="${ml}" x2="${W - mr}" y1="${Y(thr)}" y2="${Y(thr)}"/><text class="fc-thr-l" x="${ml + 4}" y="${Y(thr) - 5}">Reorder ${esc(fmtL(thr))}</text>` : '';
  const maxSvg = cap ? `<line class="fc-max" x1="${ml}" x2="${W - mr}" y1="${Y(cap)}" y2="${Y(cap)}"/><text class="fc-max-l" x="${ml + 4}" y="${Y(cap) - 5}">Max safe fill ${esc(fmtL(cap))}</text>` : '';
  const dots = pts.map((p, i) => `<circle class="fc-pt${(thr != null && p.litres < thr) || (cap && p.litres > cap) ? ' low' : ''}" cx="${xs[i]}" cy="${Y(lim(p.litres))}" r="4"/>`).join('');
  const lp = pts[n - 1];
  // Put the latest value under its point when it would clash with the max-fill label or the top edge.
  const ly = Y(lim(lp.litres)), below = ly < mt + 16 || (cap && Math.abs(ly - Y(cap)) < 16);
  const endLbl = `<text class="fc-ax" style="fill:var(--ink);font-weight:600" x="${xs[n - 1] - 8}" y="${below ? ly + 18 : ly - 10}" text-anchor="end">${esc(fmtL(lp.litres))}</text>`;
  const desc = `IOR tank readings, ${n} from ${fmtDate(pts[0].date)} to ${fmtDate(lp.date)}. Use the left and right arrow keys to step through readings.`;
  el.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" tabindex="0" aria-label="${esc(desc)}">
    <text class="fc-ax" x="0" y="11">L</text>${grid}${maxSvg}${thrSvg}<path class="fc-area" d="${area}"/><path class="fc-line" d="${line}"/>
    <line class="fc-cross" x1="${xs[si]}" x2="${xs[si]}" y1="${mt}" y2="${mt + ph}"/>${dots}<circle class="fc-sel" cx="${xs[si]}" cy="${Y(lim(sel.litres))}" r="6"/>${endLbl}${lbl.join('')}</svg>`;
  el.dataset.xs = JSON.stringify(xs.map(x => Math.round(x)));
  const rd = el.parentElement && el.parentElement.querySelector('.fc-read');
  if (rd && rd.classList.contains('fc-read')) {
    const wd = new Intl.DateTimeFormat('en-AU', { timeZone: 'UTC', weekday: 'short' }).format(new Date(sel.date + 'T00:00:00Z'));
    rd.innerHTML = `<strong>${esc(fmtL(sel.litres))}</strong><span>${esc(wd)} ${fmtDate(sel.date)}${sel.by ? `, ${esc(sel.by)}` : ''}${si === n - 1 ? ' (latest)' : ''}${thr != null && sel.litres < thr ? '. Below reorder level' : ''}</span>`;
  }
}
function bindFuelChart(el) {
  if (el.dataset.bound) return;
  el.dataset.bound = '1';
  const pick = e => {
    const svg = el.querySelector('svg'); if (!svg || !el.dataset.xs) return;
    const x = e.clientX - svg.getBoundingClientRect().left, xs = JSON.parse(el.dataset.xs);
    let bi = 0; xs.forEach((v, i) => { if (Math.abs(v - x) <= Math.abs(xs[bi] - x)) bi = i; });
    const p = fuelSeries()[bi];
    if (p && p.id !== fuelSelId) { fuelSelId = p.id; drawFuelChart(el); }
  };
  el.addEventListener('pointerdown', pick);
  el.addEventListener('pointermove', e => { if (e.pointerType === 'mouse' || e.buttons) pick(e); });
  el.addEventListener('keydown', e => {
    if (e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
    e.preventDefault();
    const pts = fuelSeries(); let i = pts.findIndex(p => p.id === fuelSelId); if (i < 0) i = pts.length - 1;
    fuelSelId = pts[Math.max(0, Math.min(pts.length - 1, i + (e.key === 'ArrowRight' ? 1 : -1)))].id;
    drawFuelChart(el); const svg = el.querySelector('svg'); if (svg) svg.focus();
  });
}
function drawCharts() { $$('[data-chart="fuel"]').forEach(el => { drawFuelChart(el); bindFuelChart(el); }); }
let resizeT;
window.addEventListener('resize', () => { clearTimeout(resizeT); resizeT = setTimeout(() => $$('[data-chart="fuel"]').forEach(drawFuelChart), 120); });

// Mini level bar for the summary tile: same colours and 0 to max-safe-fill scale as the gauge.
function kpiTank(l, thr, cap) {
  if (!cap) return '';
  const pct = v => Math.max(0, Math.min(100, v / cap * 100));
  const st = l > cap ? 'over' : thr != null && l < thr ? 'low' : '';
  return `<span class="kbar" aria-hidden="true"><span class="kbar-t"><span class="kbar-f ${st}" style="width:${pct(l).toFixed(1)}%"></span>${thr != null ? `<span class="kbar-r" style="left:${pct(thr).toFixed(1)}%"></span>` : ''}</span><span class="kbar-p">${Math.round(pct(l))}% of ${Math.round(cap).toLocaleString('en-AU')} L</span></span>`;
}
function tankGauge(fr, thr, cap, H) {
  const lv = fr ? fr.litres : 0, max = cap || Math.max(lv, 1);
  const pct = v => Math.max(0, Math.min(100, v / max * 100));
  const st = !fr ? '' : cap && lv > cap ? 'over' : thr != null && lv < thr ? 'low' : '';
  const label = fr ? `${Math.round(lv / (cap || max) * 100)}%` : '—';
  return `<div class="gauge" style="height:${H}px" role="img" aria-label="IOR fuel tank ${fr ? fmtL(lv) : 'no reading'}${cap ? `, ${label} of ${fmtL(cap)} max safe fill` : ''}${thr != null ? `, reorder level ${fmtL(thr)}` : ''}">
    <div class="g-tank"><div class="g-fill ${st}" style="height:${pct(lv).toFixed(1)}%"></div>
      ${cap ? `<span class="g-ln max" style="bottom:${pct(cap).toFixed(1)}%"></span>` : ''}${thr != null ? `<span class="g-ln" style="bottom:${pct(thr).toFixed(1)}%"></span>` : ''}
</div><span class="g-pct">${label}${cap ? ' full' : ''}</span>
    <div class="g-scale" aria-hidden="true">${cap ? `<span style="bottom:${pct(cap).toFixed(1)}%"><b>${Math.round(cap).toLocaleString('en-AU')}</b>max safe</span>` : ''}${thr != null ? `<span class="thr" style="bottom:${pct(thr).toFixed(1)}%"><b>${Math.round(thr).toLocaleString('en-AU')}</b>reorder</span>` : ''}<span style="bottom:0"><b>0</b></span></div>
  </div>`;
}

function fuelSummary(page) {
  const fr = latestReading(), thr = S.settings.fuelThreshold, cap = S.settings.tankCapacity, low = isLowStock(fr);
  const add = Number(S.settings.orderTemplate.litres) || 3500;
  const age = fr ? -daysUntil(fr.date) : null;
  const ageTxt = age == null ? '' : age <= 0 ? 'today' : age === 1 ? 'yesterday' : `${age} days ago`;
  const n = fuelSeries().length, o = nextOrder(), H = page ? 230 : 210;
  const chart = n >= 2
    ? `<div class="fchart" data-chart="fuel" data-h="${H}"></div><div class="fc-read" aria-live="polite"></div>`
    : `<div class="fchart" style="min-height:${H}px"><div class="fc-empty" style="min-height:${H}px">${n ? 'Only one reading so far. Log another reading to see how stock is changing.' : 'No readings yet. Log the tank level to start the graph.'}</div></div>`;
  const over = fr && cap ? fr.litres > cap : false;
  const after = fr ? fr.litres + add : null, afterOver = after != null && cap && after > cap;

    order = `<div class="no-t">${fmtL(o.litres)} ${esc(o.product || '')}${o.supplier ? `, ${esc(o.supplier)}` : ''}${exChip(o)}</div>

      <dt>Requested delivery</dt><dd>${o.requestedDate ? fmtDate(o.requestedDate) : badge('missing', 'Not entered')}</dd>

  } else order = `<p class="empty">No fuel on order.${low ? ' Stock is below the reorder level, so order now.' : ''}</p>`;
  return `<div class="fuel-head"><div class="fuel-fig">${fr ? Math.round(fr.litres).toLocaleString('en-AU') : '—'}<small>L</small></div>
      <div>${over ? badge('alert', 'Above max safe fill') : low ? badge('low', 'Low stock, order now') : fr && thr != null ? badge('complete', 'Above reorder level') : ''}</div></div>
    <p class="fuel-meta">${fr ? `Latest reading ${fmtDate(fr.date)} (${ageTxt})${fr.by ? ` by ${esc(fr.by)}` : ''}` : 'No reading yet'}${page ? `. Reorder at ${fmtL(thr)} <button class="btn-text" style="padding:0 0 0 4px;min-height:0" data-act="threshold">Change</button>` : ''}</p>
    <div class="tankrow">${tankGauge(fr, thr, cap, H)}<div class="tankchart">${chart}</div></div>
    <div class="fstats">
      <div><span class="k">Room to max</span><b>${fr && cap ? fmtL(Math.max(0, cap - fr.litres)) : '—'}</b></div>
      <div class="${afterOver ? 'warn' : ''}"><span class="k">After +${Math.round(add).toLocaleString('en-AU')} L refill</span><b>${after == null ? '—' : afterOver ? 'Won’t fit' : fmtL(after)}</b></div>
      <div class="${low ? 'warn' : ''}"><span class="k">Reorder at</span><b>${fmtL(thr)}</b></div>
    </div>
    <div class="btn-row"><button class="btn btn-primary" data-act="refill">Refill +${Math.round(add).toLocaleString('en-AU')} L</button><button class="btn btn-secondary" data-act="add" data-kind="reading">Log reading</button>${o ? `<button class="btn btn-secondary" data-reg="${reg(() => openEditor('order', o.id))}">Order details</button>` : `<button class="btn btn-secondary" data-act="orderTemplate">Order ${Math.round(add).toLocaleString('en-AU')} L</button>`}</div>
    <div class="next-order"><h3 class="mini-h">Next order</h3>${order}</div>`;
}

// Refill: the delivery is in the tank. Logs a new reading of latest + order quantity
// (3,500 L by default) and marks the open order delivered.
async function refill() {
  const fr = latestReading(), add = Number(S.settings.orderTemplate.litres) || 3500, cap = S.settings.tankCapacity, o = nextOrder();
  if (!fr) { openEditor('reading', null, { notes: `Refill +${add} L` }); toast('No earlier reading. Enter the tank level after the refill.'); return; }
  const after = fr.litres + add;
  if (cap && after > cap) {
    if (await askConfirm(`A ${fmtL(add)} refill won’t fit. The tank has ${fmtL(fr.litres)} and holds a maximum of ${fmtL(cap)}, so there’s room for ${fmtL(Math.max(0, cap - fr.litres))}. Log the actual level instead?`, 'Log actual level'))
      openEditor('reading', null, { notes: 'Refill' });
    return;
  }
  const msg = `Log a ${fmtL(add)} refill now? The IOR tank goes from ${fmtL(fr.litres)} to ${fmtL(after)}.`
    + (o ? ` The ${fmtL(o.litres)} order${o.supplier ? ' from ' + o.supplier : ''} will be marked delivered.` : '');
  if (!(await askConfirm(msg, `Refill +${Math.round(add).toLocaleString('en-AU')} L`))) return;
  withUndo('Refill logged', () => {
    const now = nowStamp(), who = S.settings.userName || '';
    S.fuelReadings.push({ id: uid(), date: todayISO(), litres: after, by: who, notes: `Refill +${add} L${o && o.supplier ? ', ' + o.supplier + ' delivery' : ''}`, createdAt: now, updatedAt: now, updatedBy: who, archived: false });
    if (o) { o.status = 'delivered'; if (!o.confirmedDate) o.confirmedDate = todayISO(); delete o.example; stamp(o); }
  });
}

const WX_ID = 'YBSU';
const WX = { status: 'idle', data: null, at: 0 };
const hm24 = (d, tz) => new Intl.DateTimeFormat('en-GB', { timeZone: tz, hour: '2-digit', minute: '2-digit', hourCycle: 'h23' }).format(d);

      ${g.items.map(w => `<button type="button" class="wg-i" data-reg="${reg(w.fn)}"><span class="wk">${esc(w.kind)}</span><span class="w-what">${esc(w.what)}</span>${w.when ? `<span class="w-when ${w.s === 'overdue' || w.s === 'soon' ? w.s : ''}">${esc(w.when)}</span>` : ''}</button>`).join('')}</div></li>`).join('')}</ul>`
    : '<p class="empty">You’re not waiting on anyone. Set a task to “Waiting on someone else” to track it here.</p>';

  const fleet = S.aircraft.map(ac => {
    const nx = acSummary(ac).next, defects = acSummary(ac).defects;
    return `<button class="strip st-${esc(ac.status)}" data-reg="${reg(() => goAircraft(ac.ident))}"><span class="band">${esc(AC_AVAIL[ac.status] || ac.status)}</span><span class="in">
      <span class="hd"><span class="id">${esc(ac.ident)}</span>${ac.type ? `<span class="ty">${esc(ac.type)}</span>` : ''}</span>
      <span class="hrs"><span>Engine <b>${ac.engineHours != null ? fmtH(ac.engineHours) : 'Not entered'}</b></span>${ac.airTime != null ? `<span>Air <b>${fmtH(ac.airTime)}</b></span>` : ''}</span>
      ${ac.restrictions && ac.status !== 'serviceable' ? `<span class="restr">${esc(trunc(ac.restrictions, 80))}</span>` : ''}
      <span class="nx"><span class="k">Next maintenance</span>${nx ? `<span>${esc(nx.m.title)}</span><span>${nx.st.parts.map(p => badge(p.s, p.txt)).join(' ')}</span>` : '<span class="muted">None entered</span>'}</span>
      ${defects ? `<span class="ln">${plural(defects, 'open defect')}</span>` : ''}
    </span></button>`;
  }).join('');

  const inst = S.instructors.filter(p => !p.archived).map(p => ({ p, c: checkState(p) }))
    .sort((a, b) => { const g = x => x.c.s === 'missing' ? 2 : x.c.d < 0 ? 0 : 1; return g(a) - g(b) || (a.c.d ?? 0) - (b.c.d ?? 0) || String(a.p.name).localeCompare(String(b.p.name)); });
  const quals = [];
  S.instructors.forEach(p => { if (!p.archived) (p.quals || []).forEach(q => { if (q.expiry && ['overdue', 'soon'].includes(dateStatus(q.expiry))) quals.push({ p, q, d: daysUntil(q.expiry) }); }); });
  quals.sort((a, b) => a.d - b.d);
  const instHTML = inst.length ? `<ul class="list">${inst.map(({ p, c }) => `<li><button class="irow" data-reg="${reg(() => openEditor('instructor', p.id))}"><span class="mk mk-${c.s}"></span><span><span class="nm">${esc(p.name)}</span><span class="dt">Next check ${p.nextCheck ? fmtDate(p.nextCheck) : 'not entered'}</span></span><span class="ist ist-${c.s}">${esc(c.txt)}</span></button></li>`).join('')}</ul>`
    : '<p class="empty">No instructors yet.</p><button class="btn btn-sm btn-secondary" data-act="add" data-kind="instructor">Add instructor</button>';
  const qualHTML = `<div class="mc-cal"><h3 class="mini-h">Qualification expiries <span class="n2">(not currency checks)</span></h3>${quals.length ? `<ul class="list">${quals.map(({ p, q, d }) => `<li><button class="irow" data-reg="${reg(() => openEditor('instructor', p.id))}"><span class="mk mk-${d < 0 ? 'overdue' : 'soon'}"></span><span><span class="nm">${esc(q.label || 'Qualification')}</span><span class="dt">${esc(p.name)}, expires ${fmtDate(q.expiry)}</span></span><span class="ist ist-${d < 0 ? 'overdue' : 'soon'}">${d < 0 ? `Expired ${plural(-d, 'day')} ago` : d === 0 ? 'Expires today' : `Expires in ${plural(d, 'day')}`}</span></button></li>`).join('')}</ul>` : `<p class="empty">None expiring in the next ${S.settings.dueSoonDays} days.</p>`}</div>`;

  const up = upcoming(upWindow);
  const days = {};
  up.forEach(e => (days[e.date] = days[e.date] || []).push(e));
  const upHTML = up.length ? Object.keys(days).map(dt => `<div class="day"><div class="day-h">${daysUntil(dt) === 0 ? 'Today, ' : daysUntil(dt) === 1 ? 'Tomorrow, ' : ''}${esc(fmtDay(dt))}</div><ul class="list">${days[dt].map(e => `<li><button class="item" data-reg="${reg(e.fn)}"><span class="tx"><span class="t">${esc(e.title)}</span><span class="d">${esc(e.detail)}</span></span></button></li>`).join('')}</ul></div>`).join('') : `<p class="empty">Nothing dated in the next ${upWindow} days.</p>`;

  const hr = Number(new Intl.DateTimeFormat('en-AU', { timeZone: TZ, hour: 'numeric', hourCycle: 'h23' }).format(new Date()));
  const first = String(S.settings.userName || '').trim().split(/\s+/)[0];
  const lvl = n.overdue || n.alert ? 'crit' : n.low || n.soon ? 'warn' : 'ok';
  const now = new Date();
  return `<section class="hero"><div class="hero-in"><div class="h-greet">
      <p class="eyebrow">Operations · Caloundra YCDR</p>
      <h1>${hr < 12 ? 'Good morning' : hr < 17 ? 'Good afternoon' : 'Good evening'}${first ? ', ' + esc(first) : ''}</h1>
      <p class="hero-date">${esc(longDate)}, Brisbane time</p></div>
    <div class="h-clock"><div class="clockcard" role="group" aria-label="Current time">
      <div class="ck-lbl"><span>Local · Brisbane</span><span>AEST UTC+10</span></div>
      <div class="ck-big" data-clk="local">${clockStr(now, TZ)}</div>
      <div class="ck-utc"><span class="z">UTC</span><span class="v" data-clk="utc">${clockStr(now, 'UTC')}</span><span class="dd" data-clk="utcday">${utcDay(now)}</span></div></div></div>
    <div class="h-act"><button type="button" class="ops ops-${lvl}" data-act="kpiOverdue"><strong>${{ crit: 'Action needed', warn: 'Watch', ok: 'All clear' }[lvl]}</strong><span>${lvl === 'ok' ? 'Nothing overdue or due soon' : esc(attSub)}</span></button>
    <div class="quick"><button class="btn btn-primary" data-act="add" data-kind="task">Add task</button><button class="btn btn-secondary" data-act="hours">Update hours</button><button class="btn btn-secondary" data-act="add" data-kind="reading">Log fuel reading</button><button class="btn btn-secondary" data-act="addMenu" aria-haspopup="dialog">Add…</button></div></div></div></section>
  <section class="kpis" aria-label="Summary">${k1}${k2}${k3}${k4}${k5}</section>
  ${banners()}
  <div class="grid">
    <section class="panel span-12" id="p-wx"><div class="panel-h"><h2>${ICO('cloud')}YBSU weather</h2><span class="sub">Sunshine Coast Airport, METAR and TAF</span></div><div id="wx-body">${wxBody()}</div></section>
    <section class="panel span-7" id="p-maint"><div class="panel-h"><h2>${ICO('wrench')}Maintenance hours remaining</h2><span class="sub">Next hour-based item per aircraft</span></div>${maintChart()}</section>
    <section class="panel span-5"><div class="panel-h"><h2>${ICO('drop')}IOR fuel tank</h2><button class="btn-text" data-act="go" data-view="fuel">Fuel details</button></div>${fuelSummary(false)}</section>
    <section class="panel span-7" id="p-attention"><div class="panel-h"><h2>${ICO('flag')}Priority actions</h2><span class="sub">${esc(attSub)}</span></div>${attHTML}</section>
    <section class="panel span-5" id="p-inst"><div class="panel-h"><h2>${ICO('user')}Instructor checks</h2><button class="btn-text" data-act="go" data-view="instructors">All instructors</button></div>${instHTML}${qualHTML}</section>
    <section class="panel span-12"><div class="panel-h"><h2>${ICO('plane')}Aircraft</h2><span class="sub">${full + restr} of ${S.aircraft.length} available${restr ? `, ${restr} with restrictions` : ''}</span></div><div class="fleet">${fleet}</div></section>
    <section class="panel span-5 fit"><div class="panel-h"><h2>${ICO('hourglass')}Waiting on</h2><span class="sub">${groups.length ? plural(groups.length, 'person or supplier').replace('person or suppliers', 'people or suppliers') : ''}</span></div>${waitHTML}</section>
    <section class="panel span-7 fit" id="p-upcoming"><div class="panel-h"><h2>${ICO('calendar')}Coming up</h2><span class="seg" role="group" aria-label="Time window"><button type="button" data-act="up" data-days="7" aria-pressed="${upWindow === 7}">7 days</button><button type="button" data-act="up" data-days="30" aria-pressed="${upWindow === 30}">30 days</button></span></div>${upHTML}</section>
  </div>`;
}

function recMaint(m) {
  const st = maintStatus(m);
  const counter = m.counter === 'none' ? 'Calendar' : lab(COUNTERS, m.counter);
  const due = [m.counter !== 'none' && m.dueHours != null ? `due at ${fmtH(m.dueHours)} hrs` : '', m.dueDate ? `due ${fmtDate(m.dueDate)}` : ''].filter(Boolean).join(' or ');
  return `<div class="rec${m.archived ? ' is-arch' : ''}">
    <button class="rec-main" data-reg="${reg(() => openEditor('maint', m.id))}"><span class="t">${esc(m.title)}${exChip(m)}${m.archived ? ' <span class="b b-ok">Archived</span>' : ''}</span>
      <span class="d">${esc(counter)}${due ? ', ' + esc(due) : ''}. ${esc(lab(MAINT_ST, m.status))}${m.bookingDate ? `, booking ${fmtDate(m.bookingDate)}` : ''}.</span>
      ${m.notes ? `<span class="n">${esc(m.notes)}</span>` : ''}</button>
    <span class="rec-side">${st.parts.map(p => badge(p.s, p.txt)).join(' ')}${m.status !== 'done' && !m.archived ? `<button class="btn btn-sm btn-secondary" data-reg="${reg(() => withUndo('Marked complete', () => { m.status = 'done'; m.completedAt = nowStamp(); delete m.example; stamp(m); }))}">Mark complete</button>` : ''}</span>
  </div>`;
}
function recDefect(d) {
  const st = d.status === 'closed' ? badge('complete', 'Closed') : d.status === 'waiting' ? badge('waiting', `Waiting on ${d.waitingOn || 'someone else'}`) : badge('info', 'Open');
  return `<div class="rec${d.archived ? ' is-arch' : ''}">
    <button class="rec-main" data-reg="${reg(() => openEditor('defect', d.id))}"><span class="t">${esc(d.description)}${exChip(d)}${d.archived ? ' <span class="b b-ok">Archived</span>' : ''}</span>
      <span class="d">Raised ${fmtDate(d.raised)}</span>
      ${d.followUp ? `<span class="n">Follow-up: ${esc(d.followUp)}</span>` : '<span class="n muted">No follow-up action recorded</span>'}</button>
    <span class="rec-side">${st}${d.status !== 'closed' && !d.archived ? `<button class="btn btn-sm btn-secondary" data-reg="${reg(() => withUndo('Defect closed', () => { d.status = 'closed'; d.closedAt = nowStamp(); delete d.example; stamp(d); }))}">Close</button>` : ''}</span>
  </div>`;
}

function renderAircraft() {
  const secs = S.aircraft.map(ac => {
    const all = S.maintenance.filter(m => m.aircraftId === ac.id);
    const maint = all.filter(m => showAcDone || (!m.archived && m.status !== 'done')).sort(maintSort);
    const allD = S.defects.filter(d => d.aircraftId === ac.id);
    const defs = allD.filter(d => showAcDone || (!d.archived && d.status !== 'closed')).sort((a, b) => String(b.raised || '').localeCompare(String(a.raised || '')));
    const nx = acSummary(ac).next;
    return `<section class="ac st-${esc(ac.status)}" id="acsec-${esc(ac.ident)}">
      <div class="ac-head">
        <div class="ac-id"><span class="id">${esc(ac.ident)}</span>${ac.type ? `<span class="ty">${esc(ac.type)}</span>` : ''}${exChip(ac)}</div>
        <div class="ac-state"><span class="stt">${esc(AC_AVAIL[ac.status] || ac.status)}</span>${ac.restrictions ? `<span class="restr">${esc(ac.restrictions)}</span>` : '<span class="muted">No restrictions recorded</span>'}
          <span class="ac-next"><span class="k">Next maintenance:</span>${nx ? `<strong>${esc(nx.m.title)}</strong> ${nx.st.parts.map(p => badge(p.s, p.txt)).join(' ')}` : '<span class="muted">None entered</span>'}</span></div>
        <dl class="ctr"><div><dt>Engine hours</dt><dd>${ac.engineHours != null ? fmtH(ac.engineHours) : badge('missing', 'Not entered')}</dd></div><div><dt>Air time</dt><dd>${ac.airTime != null ? fmtH(ac.airTime) : '<span class="na muted">Not tracked</span>'}</dd></div></dl>
        <div class="ac-act"><button class="btn btn-sm btn-secondary" data-reg="${reg(() => openEditor('aircraft', ac.id))}">Update record</button></div>
        <p class="ac-meta">Responsible: ${ac.responsible ? esc(ac.responsible) : badge('missing', 'Not set')}. Hours warning ${fmtH(warnFor(ac))} hrs${ac.hoursWarn != null ? ' (this aircraft)' : ' (default)'}. Updated ${ac.updatedAt ? fmtStamp(ac.updatedAt) + (ac.updatedBy ? ' by ' + esc(ac.updatedBy) : '') : 'never'}.</p>
      </div>
      ${ac.notes ? `<div class="ac-notes"><strong>Maintenance notes:</strong> ${esc(ac.notes)}</div>` : ''}
      <div class="ac-body">
        <div class="sub"><div class="sub-h"><h3>Maintenance due</h3><button class="btn-text" data-act="add" data-kind="maint" data-ac="${esc(ac.id)}">Add item</button></div>
          ${maint.length ? maint.map(recMaint).join('') : '<p class="empty">No open maintenance items. Add the next inspection so hours remaining show here.</p>'}
          ${!showAcDone && all.length > maint.length ? `<p class="meta">${all.length - maint.length} completed or archived hidden</p>` : ''}</div>
        <div class="sub"><div class="sub-h"><h3>Defects and follow-up</h3><button class="btn-text" data-act="add" data-kind="defect" data-ac="${esc(ac.id)}">Report defect</button></div>
          ${defs.length ? defs.map(recDefect).join('') : '<p class="empty">No open defects.</p>'}
          ${!showAcDone && allD.length > defs.length ? `<p class="meta">${allD.length - defs.length} closed or archived hidden</p>` : ''}</div>
      </div>
    </section>`;
  }).join('');
  return `${banners()}<div class="view-h"><h1>Aircraft</h1><div class="view-actions">
    <button class="btn btn-primary" data-act="hours">Update hours</button>
    <button class="btn btn-secondary" data-act="add" data-kind="maint">Add maintenance item</button>
    <button class="btn btn-secondary" data-act="add" data-kind="defect">Report defect</button>
    <button class="btn btn-secondary" data-act="warnings">Warning levels</button>
    <label class="tog"><input type="checkbox" data-act="toggleAcDone"${showAcDone ? ' checked' : ''}> Show completed and archived</label>
  </div></div>${secs}`;
}

function renderFuel() {
  const t = S.settings.orderTemplate;
  const orders = S.fuelOrders.filter(o => showFuelDone || (!o.archived && !['delivered', 'cancelled'].includes(o.status)))
    .sort((a, b) => String(b.orderedDate || b.createdAt || '').localeCompare(String(a.orderedDate || a.createdAt || '')));
  const hiddenOrders = S.fuelOrders.length - orders.length;
  const issues = S.fuelIssues.filter(i => showFuelDone || (!i.archived && i.status !== 'resolved'));
  const readings = [...S.fuelReadings].sort((a, b) => String(b.date).localeCompare(String(a.date)) || String(b.createdAt).localeCompare(String(a.createdAt)));

  const orderRows = orders.length ? orders.map(o => {
    const st = orderStatus(o);
    const active = !['delivered', 'cancelled'].includes(o.status) && !o.archived;
    return `<div class="rec${o.archived ? ' is-arch' : ''}">
      <button class="rec-main" data-reg="${reg(() => openEditor('order', o.id))}"><span class="t">${fmtL(o.litres)} ${esc(o.product || '')}${o.supplier ? `, ${esc(o.supplier)}` : ''}${exChip(o)}</span>
        <span class="d">${esc(lab(ORDER_ST, o.status))}. Ordered ${fmtDate(o.orderedDate)}. Requested ${fmtDate(o.requestedDate)}. ${o.confirmedDate ? `Confirmed ${fmtDate(o.confirmedDate)}.` : 'Not yet confirmed.'}</span>
        ${o.notes ? `<span class="n">${esc(o.notes)}</span>` : ''}</button>
      <span class="rec-side">${badge(st.s, st.txt)}${active ? `<button class="btn btn-sm btn-secondary" data-reg="${reg(() => showMessage(o))}">Order message</button><button class="btn btn-sm btn-secondary" data-reg="${reg(() => markDelivered(o))}">Mark delivered</button>` : ''}</span>
    </div>`;
  }).join('') : '<p class="empty">No open fuel orders.</p>';

  const issueRows = issues.length ? issues.map(i => `<div class="rec${i.archived ? ' is-arch' : ''}">
      <button class="rec-main" data-reg="${reg(() => openEditor('issue', i.id))}"><span class="t">${esc(i.title)}${exChip(i)}</span><span class="d">${esc(i.equipment || '')}, reported ${fmtDate(i.reported)}</span>${i.notes ? `<span class="n">${esc(i.notes)}</span>` : ''}</button>
      <span class="rec-side">${i.status === 'resolved' ? badge('complete', 'Resolved') : i.status === 'waiting' ? badge('waiting', `Waiting on ${i.waitingOn || 'someone else'}`) : badge('info', 'Open')}${i.status !== 'resolved' && !i.archived ? `<button class="btn btn-sm btn-secondary" data-reg="${reg(() => withUndo('Issue resolved', () => { i.status = 'resolved'; delete i.example; stamp(i); }))}">Resolve</button>` : ''}</span>
    </div>`).join('') : '<p class="empty">No open bowser or pump issues.</p>';

  const histRows = readings.slice(0, 12).map((r, idx) => {
    const prev = readings[idx + 1];
    const diff = prev ? r.litres - prev.litres : null;
    return `<tr><td><button class="btn-text" style="padding:0" data-reg="${reg(() => openEditor('reading', r.id))}">${fmtDate(r.date)}</button>${exChip(r)}</td><td class="num">${fmtL(r.litres)}</td><td class="num">${diff == null ? '—' : (diff > 0 ? '+' : diff < 0 ? '−' : '') + fmtL(Math.abs(diff))}</td><td>${esc(r.by || '')}</td></tr>`;
  }).join('');

  return `${banners()}<div class="view-h"><h1>Fuel</h1><div class="view-actions">
      <button class="btn btn-primary" data-act="add" data-kind="reading">Log reading</button>
      <button class="btn btn-secondary" data-act="orderTemplate">Order from template</button>
      <button class="btn btn-secondary" data-act="add" data-kind="issue">Report bowser or pump issue</button>
      <label class="tog"><input type="checkbox" data-act="toggleFuelDone"${showFuelDone ? ' checked' : ''}> Show delivered and resolved</label>
    </div></div>
    <div class="grid">
      <section class="panel span-5"><div class="panel-h"><h2>${ICO('drop')}IOR fuel tank</h2></div>${fuelSummary(true)}</section>
      <section class="panel span-7"><div class="panel-h"><h2>${ICO('receipt')}Fuel orders</h2><span class="sub">${hiddenOrders > 0 && !showFuelDone ? `${hiddenOrders} delivered or archived hidden` : ''}</span></div>
        <div class="tmpl"><div><span class="t">Standard order: ${fmtL(t.litres)} ${esc(t.product)}${t.supplier ? ` from ${esc(t.supplier)}` : ''}</span>${t.notes ? `<span class="d">${esc(t.notes)}</span>` : ''}</div>
          <div class="btn-row" style="margin:0"><button class="btn btn-sm btn-primary" data-act="orderTemplate">New order</button><button class="btn btn-sm btn-secondary" data-act="editTemplate">Edit template</button><button class="btn-text" data-act="add" data-kind="order">Other order</button></div></div>
        ${orderRows}</section>
      <section class="panel span-6"><div class="panel-h"><h2>${ICO('wrench')}Bowser and pump issues</h2><button class="btn-text" data-act="add" data-kind="issue">Report issue</button></div>${issueRows}</section>
      <section class="panel span-6"><div class="panel-h"><h2>${ICO('clock')}Reading history</h2><span class="sub">${readings.length ? `Latest ${Math.min(12, readings.length)}` : ''}</span></div>
        ${readings.length ? `<div class="scroll-x"><table class="hist"><thead><tr><th>Date</th><th class="num">Reading</th><th class="num">Change</th><th>Read by</th></tr></thead><tbody>${histRows}</tbody></table></div>` : '<p class="empty">No readings yet. Log the bulk tank level to start tracking stock.</p>'}</section>
    </div>`;
}

function renderInstructors() {
  const list = S.instructors.filter(p => showInstArch || !p.archived).sort((a, b) => String(a.name).localeCompare(String(b.name)));
  const cards = list.map(p => {
    const quals = (p.quals || []);
    return `<article class="card${p.archived ? ' is-arch' : ''}">
      <div class="card-h"><div><h2>${esc(p.name)}${exChip(p)}</h2><span class="role">${p.role ? esc(p.role) : 'Role not set'}${p.archived ? ', archived' : ''}</span></div><button class="btn btn-sm btn-secondary" data-reg="${reg(() => openEditor('instructor', p.id))}">Edit</button></div>
      <div>
        <div class="rowline"><span class="k">Last currency check</span><span>${p.lastCheck ? fmtDate(p.lastCheck) : badge('missing', 'Not entered')}</span></div>
        <div class="rowline"><span class="k">Next check due</span><span>${p.nextCheck ? `${fmtDate(p.nextCheck)} ${dueBadge(p.nextCheck)}` : badge('missing', 'Not entered')}</span></div>
        ${quals.map(q => `<div class="rowline"><span class="k">${esc(q.label || 'Unnamed item')}</span><span>${q.expiry ? `${fmtDate(q.expiry)} ${daysUntil(q.expiry) < 0 ? badge('overdue', 'Expired') : dueBadge(q.expiry)}` : badge('missing', 'No expiry')}</span></div>`).join('')}
        ${!quals.length ? '<div class="rowline"><span class="k">Qualifications and expiries</span><span class="muted">None recorded</span></div>' : ''}
      </div>
      ${p.restrictions ? `<div class="callout"><strong>Restrictions:</strong> ${esc(p.restrictions)}</div>` : ''}
      ${p.paperwork ? `<div class="callout dark"><strong>Outstanding paperwork:</strong> ${esc(p.paperwork)}</div>` : ''}
      ${p.notes ? `<div class="n muted">${esc(p.notes)}</div>` : ''}
      <p class="meta">Updated ${p.updatedAt ? fmtStamp(p.updatedAt) + (p.updatedBy ? ' by ' + esc(p.updatedBy) : '') : 'never'}</p>
    </article>`;
  }).join('');
  return `${banners()}<div class="view-h"><h1>Instructors</h1><div class="view-actions">
    <button class="btn btn-primary" data-act="add" data-kind="instructor">Add instructor</button>
    <label class="tog"><input type="checkbox" data-act="toggleInstArch"${showInstArch ? ' checked' : ''}> Show archived</label></div></div>
    ${list.length ? `<div class="cards">${cards}</div>` : '<div class="panel"><p class="empty">No instructors yet. Add each instructor with their check dates and expiries from your records.</p></div>'}`;
}

function renderTasks() {
  const counts = {
    open: S.tasks.filter(t => !t.archived && t.status !== 'done').length,
    waiting: S.tasks.filter(t => !t.archived && t.status === 'waiting').length,
    done: S.tasks.filter(t => !t.archived && t.status === 'done').length,
    archived: S.tasks.filter(t => t.archived).length
  };
  const segs = [['open', 'Open'], ['waiting', 'Waiting'], ['done', 'Complete'], ['archived', 'Archived']]
    .map(([k, l]) => `<button type="button" data-act="taskStatus" data-s="${k}" aria-pressed="${taskFilter.status === k}">${l} (${counts[k]})</button>`).join('');
  return `${banners()}<div class="view-h"><h1>Tasks and compliance</h1><div class="view-actions">
    <button class="btn btn-primary" data-act="add" data-kind="task">Add task</button>
    ${counts.done ? '<button class="btn btn-secondary" data-act="archiveDone">Archive completed</button>' : ''}</div></div>
    <div class="toolbar"><span class="seg" role="group" aria-label="Status">${segs}</span>
      <select id="taskCat" aria-label="Category"><option value="all">All categories</option>${CATS.map(([v, l]) => `<option value="${esc(v)}"${taskFilter.cat === v ? ' selected' : ''}>${esc(l)}</option>`).join('')}</select>
      <input type="search" id="taskQ" placeholder="Search tasks" aria-label="Search tasks" value="${esc(taskFilter.q)}"></div>
    <ul class="tasklist" id="taskList"></ul>`;
}
function renderTaskList() {
  const el = $('#taskList'); if (!el) return;
  const q = taskFilter.q.trim().toLowerCase();
  const list = S.tasks.filter(t => {
    if (taskFilter.status === 'open' && (t.archived || t.status === 'done')) return false;
    if (taskFilter.status === 'waiting' && (t.archived || t.status !== 'waiting')) return false;
    if (taskFilter.status === 'done' && (t.archived || t.status !== 'done')) return false;
    if (taskFilter.status === 'archived' && !t.archived) return false;
    if (taskFilter.cat !== 'all' && t.category !== taskFilter.cat) return false;
    if (q && ![t.title, t.owner, t.notes, t.waitingOn, t.category].join(' ').toLowerCase().includes(q)) return false;
    return true;
  }).sort((a, b) => String(a.due || '9999').localeCompare(String(b.due || '9999')) || (PRIO_RANK[a.priority] ?? 2) - (PRIO_RANK[b.priority] ?? 2));
  if (!list.length) { el.innerHTML = `<li class="task"><p class="empty" style="margin:0">${q || taskFilter.cat !== 'all' ? 'No tasks match these filters.' : taskFilter.status === 'open' ? 'No open tasks. Add one when something needs doing.' : 'Nothing here.'}</p></li>`; return; }
  el.innerHTML = list.map(t => {
    const done = t.status === 'done';
    const meta = [t.category, t.owner ? `Owner: ${t.owner}` : 'No owner', t.status === 'waiting' ? `Waiting on ${t.waitingOn || 'someone else'}` : (t.status === 'progress' ? 'In progress' : '')].filter(Boolean).join('. ');
    return `<li class="task${done ? ' is-done' : ''}">
      <button type="button" class="chk" aria-pressed="${done}" aria-label="${done ? 'Mark not complete' : 'Mark complete'}: ${esc(t.title)}" data-reg="${reg(() => withUndo(done ? 'Task reopened' : 'Task complete', () => { t.status = done ? 'todo' : 'done'; if (!done) t.completedAt = nowStamp(); else delete t.completedAt; delete t.example; stamp(t); }))}"></button>
      <button type="button" class="task-main" data-reg="${reg(() => openEditor('task', t.id))}"><span class="t">${esc(t.title)}${exChip(t)}</span><span class="d">${esc(meta)}</span>${t.notes ? `<span class="n">${esc(trunc(t.notes, 160))}</span>` : ''}</button>
      <span class="task-side"><span>${t.due ? fmtDate(t.due) : ''}</span>${done ? badge('complete', t.completedAt ? `Complete ${fmtDate(new Intl.DateTimeFormat('en-CA', { timeZone: TZ }).format(new Date(t.completedAt)))}` : 'Complete') : t.due ? dueBadge(t.due) : badge('missing', 'No due date')}${t.status === 'waiting' && !done ? badge('waiting', 'Waiting') : ''}${!done && (t.priority === 'urgent' || t.priority === 'high') ? `<span class="pr pr-${t.priority}">${lab(PRIOS, t.priority)} priority</span>` : ''}</span>
    </li>`;
  }).join('');
}

/* ---------- Routing, actions, start-up ---------- */
const main = $('#main');
function render() {
  R = [];
  const fn = { overview: renderOverview, aircraft: renderAircraft, fuel: renderFuel, instructors: renderInstructors, tasks: renderTasks }[view];
  main.innerHTML = fn();
  if (view === 'tasks') renderTaskList();
  drawCharts();
  updateTabs();
  if (pendingScroll) { const el = document.getElementById(pendingScroll); pendingScroll = null; if (el) el.scrollIntoView({ block: 'start' }); }
}
function updateTabs() {
  $$('.tabs a').forEach(a => { if (a.dataset.view === view) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); });
  // Same source as the overview cards, so the numbers always agree.
  const c = { overview: 0, aircraft: 0, fuel: 0, instructors: 0, tasks: 0 };
  attentionItems().forEach(a => { if (a.sev === 'overdue') c.overview++; if (['overdue', 'alert', 'low'].includes(a.sev)) c[a.area]++; });
  $$('.tabs .count').forEach(el => { const k = el.dataset.count, v = c[k]; el.textContent = v ? String(v) : ''; el.setAttribute('aria-label', v ? (k === 'overview' ? `${v} overdue` : `${v} need action`) : ''); });
}
function route() {
  const h = location.hash.replace('#', '');
  view = VIEWS.includes(h) ? h : 'overview';
  if (dlg.open) closeDlg();
  render();
  if (!pendingScroll) window.scrollTo(0, 0);
}
function go(v) { if (location.hash === '#' + v) { render(); window.scrollTo(0, 0); } else location.hash = v; }
function goAircraft(ident) { pendingScroll = 'acsec-' + ident; go('aircraft'); }
window.addEventListener('hashchange', route);

const ACT = {
  add: d => openEditor(d.kind, null, d.ac ? { aircraftId: d.ac } : null),
  hours: openHours,
  orderTemplate: orderFromTemplate,
  editTemplate: openTemplate,
  threshold: openThreshold,
  settings: openSettings,
  export: exportData,
  clearEx: async () => { if (await askConfirm('Remove all records marked Example? Your own records stay.', 'Clear example data')) withUndo('Example data cleared', clearExamples); },
  toggleAtt: () => { showAllAtt = !showAllAtt; render(); },
  addMenu: openAddMenu,
  refill: () => refill(),
  wxRetry: () => { WX.status = WX.status === 'loading' ? 'loading' : 'idle'; loadWx(); },
  warnings: openWarnings,
  kpiOverdue: () => { if (!showAllAtt && attentionItems().filter(a => a.sev === 'overdue').length > 5) { showAllAtt = true; render(); } ACT.scroll({ id: 'p-attention' }); },
  up: d => { upWindow = Number(d.days); render(); },
  scroll: d => { const el = document.getElementById(d.id); if (el) el.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' }); },
  go: d => go(d.view),
  toggleAcDone: () => { showAcDone = !showAcDone; render(); },
  toggleFuelDone: () => { showFuelDone = !showFuelDone; render(); },
  toggleInstArch: () => { showInstArch = !showInstArch; render(); },
  taskStatus: d => { taskFilter.status = d.s; render(); },
  archiveDone: async () => {
    const n = S.tasks.filter(t => !t.archived && t.status === 'done').length;
    if (!(await askConfirm(`Archive ${plural(n, 'completed task')}? You can find them under Archived.`, 'Archive'))) return;
    withUndo(`${plural(n, 'task')} archived`, () => S.tasks.forEach(t => { if (!t.archived && t.status === 'done') { t.archived = true; stamp(t); } }));
  }
};
document.addEventListener('click', e => {
  const r = e.target.closest('[data-reg]');
  if (r && main.contains(r)) { e.preventDefault(); const f = R[Number(r.dataset.reg)]; if (f) f(); return; }
  const a = e.target.closest('[data-act]');
  if (a && !dlg.contains(a)) { if (a.tagName === 'A') e.preventDefault(); const f = ACT[a.dataset.act]; if (f) f(a.dataset, a); }
});
main.addEventListener('change', e => { if (e.target.id === 'taskCat') { taskFilter.cat = e.target.value; renderTaskList(); } });
main.addEventListener('input', e => { if (e.target.id === 'taskQ') { taskFilter.q = e.target.value; renderTaskList(); } });

window.addEventListener('storage', e => {
  if (e.key === KEY && e.newValue && !dlg.open) { try { S = normalise(JSON.parse(e.newValue)); applyTheme(); render(); } catch (_) {} }
});

let lastDay = todayISO();
const clockStr = (d, tz) => new Intl.DateTimeFormat('en-GB', { timeZone: tz, hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23' }).format(d);
const utcDay = d => new Intl.DateTimeFormat('en-AU', { timeZone: 'UTC', weekday: 'short', day: '2-digit', month: '2-digit' }).format(d);
function tick() {
  const now = new Date();
  const dd = new Intl.DateTimeFormat('en-AU', { timeZone: TZ, weekday: 'short', day: '2-digit', month: '2-digit' }).format(now);
  const loc = clockStr(now, TZ), utc = clockStr(now, 'UTC');
  $('#clock').innerHTML = `<span class="cd">${esc(dd)}, </span>${loc} AEST`;
  $$('[data-clk="local"]').forEach(e => { e.textContent = loc; });
  $$('[data-clk="utc"]').forEach(e => { e.textContent = utc; });
  $$('[data-clk="utcday"]').forEach(e => { e.textContent = utcDay(now); });
  if (now.getSeconds() === 0 && WX.data) paintWx();  // keep "x min ago" current
  const d = todayISO();
  if (d !== lastDay) { lastDay = d; if (!dlg.open) render(); }
}

(function init() {
  const raw = Store.adapter.load();
  if (raw) S = normalise(raw);
  else { S = emptyState(); applyExamples(); }
  persist();
  applyTheme();
  tick(); setInterval(tick, 1000);
  route();
  loadWx(); setInterval(loadWx, 5 * 60 * 1000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden && Date.now() - WX.at > 2 * 60 * 1000) loadWx(); });
})();
</script>
</body>
</html>
